name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tutor
          POSTGRES_PASSWORD: tutor
          POSTGRES_DB: tutor_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tutor -d tutor_platform"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://tutor:tutor@127.0.0.1:5432/tutor_platform?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: services/core/go.sum
      - name: Test
        working-directory: services/core
        run: go test ./...
      - name: Vet
        working-directory: services/core
        run: go vet ./...
      - name: Race
        working-directory: services/core
        run: go test -race ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable corepack
        run: corepack enable
      - name: Install
        working-directory: apps/web
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck
        working-directory: apps/web
        run: pnpm typecheck
      - name: Lint
        working-directory: apps/web
        run: pnpm lint
      - name: Build
        working-directory: apps/web
        run: pnpm build
