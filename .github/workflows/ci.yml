name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: services/core/go.sum
      - name: Test
        working-directory: services/core
        run: go test ./...
      - name: Vet
        working-directory: services/core
        run: go vet ./...
      - name: Race
        working-directory: services/core
        run: go test -race ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable corepack
        run: corepack enable
      - name: Install
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: apps/web
        run: pnpm typecheck
      - name: Build
        working-directory: apps/web
        run: pnpm build

