name: repet-production

x-runtime: &runtime
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  postgres:
    <<: *runtime
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: repet
      POSTGRES_DB: repet
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [backend]
    mem_limit: 1g
    cpus: 1
    pids_limit: 128
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U repet -d repet"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    <<: *runtime
    image: repet-server-api:${REPET_VERSION:-local}
    build: {context: ., dockerfile: Dockerfile, target: api}
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      HTML_PREVIEW_ADDR: :8081
      APP_PUBLIC_URL: https://${APP_DOMAIN:?Set APP_DOMAIN}
      HTML_PREVIEW_PUBLIC_URL: https://${HTML_DOMAIN:?Set a separate HTML_DOMAIN}
      CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN:?Set APP_DOMAIN}
      DATABASE_URL_FILE: /run/secrets/database_url
      DEV_AUTH_ENABLED: "false"
      COOKIE_SECURE: "true"
      REQUIRE_EMAIL_VERIFICATION: "true"
      SMTP_ADDR: ${SMTP_ADDR:?Set SMTP host:STARTTLS-port}
      SMTP_FROM: ${SMTP_FROM:?Set verified sender address}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      OBJECT_STORAGE_PATH: /private/objects
      PDF_EXTRACTOR_URL: http://pdf-extractor:8092
    secrets: [database_url, smtp_password]
    volumes: [learning-objects:/private]
    networks: [frontend, backend, pdf-private]
    read_only: true
    cap_drop: [ALL]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
    mem_limit: 768m
    cpus: 1
    pids_limit: 128
    depends_on:
      postgres: {condition: service_healthy}
      pdf-extractor: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/readyz]
      interval: 10s
      timeout: 5s
      retries: 20

  pdf-extractor:
    <<: *runtime
    image: repet-server-pdf:${REPET_VERSION:-local}
    build: {context: ., dockerfile: Dockerfile, target: pdf-extractor}
    networks: [pdf-private]
    read_only: true
    cap_drop: [ALL]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=128m,mode=1777"]
    mem_limit: 512m
    cpus: 1
    pids_limit: 64
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8092/healthz]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    <<: *runtime
    image: repet-server-web:${REPET_VERSION:-local}
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args: {HTML_PREVIEW_PUBLIC_URL: "https://${HTML_DOMAIN:?Set HTML_DOMAIN}"}
    environment:
      API_INTERNAL_URL: http://api:8080
      HTML_PREVIEW_PUBLIC_URL: https://${HTML_DOMAIN:?Set HTML_DOMAIN}
    networks: [frontend]
    read_only: true
    cap_drop: [ALL]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,mode=1777", "/app/.next/cache:rw,noexec,nosuid,size=64m,uid=1000,gid=1000"]
    mem_limit: 768m
    cpus: 1
    pids_limit: 128
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:3000/login]
      interval: 10s
      timeout: 5s
      retries: 20

  proxy:
    <<: *runtime
    image: caddy:2-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
      HTML_DOMAIN: ${HTML_DOMAIN:?Set HTML_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [frontend]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    depends_on:
      web: {condition: service_healthy}

networks:
  frontend:
  backend: {internal: true}
  pdf-private: {internal: true}

volumes:
  postgres-data:
  learning-objects:
  caddy-data:
  caddy-config:

secrets:
  db_password: {file: "${SECRETS_DIR:-./secrets}/db_password"}
  database_url: {file: "${SECRETS_DIR:-./secrets}/database_url"}
  smtp_password: {file: "${SECRETS_DIR:-./secrets}/smtp_password"}
