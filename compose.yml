name: repet

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tutor
      POSTGRES_PASSWORD: tutor
      POSTGRES_DB: tutor_platform
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutor -d tutor_platform"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.20
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
      - "127.0.0.1:${SMTP_PORT:-1025}:1025"

  api:
    build: ./services/core
    environment:
      APP_ENV: development
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://tutor:tutor@postgres:5432/tutor_platform?sslmode=disable
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      DEV_AUTH_ENABLED: "false"
      COOKIE_SECURE: "false"
      SMTP_ADDR: mailpit:1025
      SMTP_FROM: no-reply@repet.local
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"

  web:
    build: ./apps/web
    environment:
      API_INTERNAL_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/login"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"

volumes:
  postgres-data:
