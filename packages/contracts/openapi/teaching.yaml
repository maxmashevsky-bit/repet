openapi: 3.1.0
info: {title: Repet private teaching preferences, version: 1.0.0}
servers: [{url: /api/v1}]
security: [{session: []}]
paths:
  /teaching-preferences:
    get:
      summary: Get only the session tutor's private preferences; defaults have revision0
      responses:
        '200': {description: Own preferences, content: {application/json: {schema: {$ref: '#/components/schemas/Preferences'}}}}
        '401': {description: No session}
        '403': {description: Not a tutor}
    put:
      summary: Save only the session tutor's preferences using compare-and-swap revision
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/Preferences'}}}
      responses:
        '200': {description: Saved preferences with incremented revision, content: {application/json: {schema: {$ref: '#/components/schemas/Preferences'}}}}
        '400': {description: Invalid values, duplicates or unknown/server-owned fields}
        '401': {description: No session}
        '403': {description: Not a tutor}
        '409': {description: Stale revision; reload without overwriting another tab}
components:
  securitySchemes:
    session: {type: apiKey, in: cookie, name: repet_session}
  schemas:
    Preferences:
      type: object
      additionalProperties: false
      required: [revision, subjects, grades, default_duration_minutes]
      properties:
        revision: {type: integer, minimum: 0}
        subjects:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items: {type: string, enum: [math, physics, informatics, russian, english, chemistry, biology, history, geography, social_studies]}
        grades:
          type: array
          minItems: 1
          maxItems: 11
          uniqueItems: true
          items: {type: integer, minimum: 1, maximum: 11}
        default_duration_minutes: {type: integer, minimum: 1, maximum: 240}
