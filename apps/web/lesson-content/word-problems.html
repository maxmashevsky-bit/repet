<div class="twocol"><div class="card"><h3>Научимся за один урок</h3><p>Разрезать бумагу и считать изменение количества, работать со скоростью выполнения, сравнивать цены, массы и доли, доказывать единственность варианта.</p><div class="note"><strong>Правило урока:</strong> после любого действия спроси себя: «Что именно я сейчас нашёл?»</div></div><div class="card"><h3>Твой прогресс</h3><div class="progress-panel"><div><strong>${solved()}</strong>Заданий принято</div><div><strong>${Object.values(S.statuses).filter(v=>v==='independent').length}</strong>Самостоятельно</div><div><strong>${Object.values(S.statuses).filter(v=>v==='help').length}</strong>С подсказкой</div></div><p class="live-notice">Ответы и отметки сохраняются в браузере на этом устройстве.</p></div></div>
<div class="card"><h2>1. Разминка — 7 минут</h2><p>Вспомни три простых правила. Выбирай ответ. После проверки появится объяснение.</p>${DATA.warm.map(w=>`<div class="compact-line"><strong>${safe(w.text)}</strong><div class="choice-list">${w.options.map((o,i)=>`<label class="choice"><input type="radio" name="${w.id}" value="${i}" ${S.warm[w.id]?.choice===i?'checked':''} data-warm="${w.id}"><span>${safe(o)}</span></label>`).join('')}</div>${S.warm[w.id]?.checked?`<div class="feedback ${S.warm[w.id].correct?'':'error'}" role="status">${S.warm[w.id].correct?'Верно. ':'Попробуй ещё раз. '}${safe(w.ex)}</div>`:''}<div class="toolbar"><button class="btn tiny" data-action="warmcheck" data-id="${w.id}">Проверить</button></div></div>`).join('')}</div>
<div class="card"><h2>2. План занятия</h2><div class="timeline"><div class="timeitem"><b>7 мин</b><span>Разминка: сравнение, площадь, умножение.</span></div><div class="timeitem"><b>18 мин</b><span>Три понятные модели: кусочки, бригады, покупки.</span></div><div class="timeitem"><b>25 мин</b><span>Разбор исходных примеров и объяснение действий.</span></div><div class="timeitem"><b>20 мин</b><span>Исходные задачи: начать с № 1–6, № 7–8 при быстром темпе.</span></div><div class="timeitem"><b>12 мин</b><span>Самостоятельная тренировка: выбрать 4–6 заданий по уровню.</span></div><div class="timeitem"><b>5 мин</b><span>Итоговая проверка: 1–2 задачи без подсказок.</span></div><div class="timeitem"><b>3 мин</b><span>Домашняя работа и рефлексия.</span></div></div><p class="muted" style="font-size:13px;margin-top:15px">Все исходные и дополнительные задачи доступны, даже если за 90 минут вы решите только часть. Остальные — для продолжения занятия.</p></div>
<div class="toolbar"><button class="btn" data-go="examples">Начать: посмотреть на модели →</button><button class="btn subtle" data-action="reset">Сбросить прогресс</button></div>`}
function cutModel(){const cs=S.example.cut||[];return `<div class="lab" id="cutModel"><div class="lab-title">Модель 1 · 9 листов → 21 кусочек</div><p>Выбери лист <strong>нажатием</strong>, затем нажми «Разрезать на 3». Можно использовать Tab и Enter. Сначала попробуй предсказать, сколько кусочков станет после следующего разрезания.</p><label class="field" style="max-width:295px">Твой прогноз количества кусочков<input class="prediction" type="text" inputmode="numeric" data-example-field="cutPrediction" value="${safe(S.example.cutPrediction)}" placeholder="Например, 11"></label><div class="paper-grid">${Array.from({length:9},(_,i)=>`<button type="button" class="paper ${S.example.selected===i?'selected':''} ${cs.includes(i)?'cut':''}" data-action="paper-select" data-index="${i}" aria-pressed="${S.example.selected===i}" aria-label="Лист ${i+1}, ${cs.includes(i)?'разрезан на три части':'целый'}">${cs.includes(i)?'<span class="cutmark"><i></i><i></i><i></i></span>':'<span class="uncut"></span>'}<span class="paper-number">${i+1}</span></button>`).join('')}</div><div class="toolbar"><button class="btn" data-action="cut">Разрезать выбранный лист</button><button class="btn subtle" data-action="cutundo" ${!cs.length?'disabled':''}>← Отменить шаг</button><button class="btn subtle" data-action="cutreset">Повторить с начала</button></div><div class="laboutput" aria-live="polite"><div class="num">${9+cs.length*2} <span style="font-size:14px;font-weight:600">кусочков</span></div><p>Было 9 листов, разрезали ${cs.length}. Каждый разрезанный лист заменяем <strong>тремя</strong> кусочками: изменение за шаг <strong>+2</strong>.</p>${cs.length===6?'<div class="feedback">Получилось 21! Объяснение: 21 − 9 = 12 новых кусочков, 12 : 2 = 6 листов разрезали.</div>':''}${S.example.cutReport?`<p class="live-notice">${safe(S.example.cutReport)}</p>`:''}</div></div>`}
function workModel(){const d=+S.example.workDay||0,a=80*(d+1),b=90*d;return `<div class="lab" id="workModel"><div class="lab-title">Модель 2 · Две бригады и фора одного дня</div><p>Первая делает 80 сосен за день, вторая — 90, но начала на день позже. Перед следующим шагом предскажи, когда их результаты сравняются.</p><div class="model-input"><label for="workRange">Дней второй бригады</label><input type="range" id="workRange" min="0" max="10" step="1" value="${d}" data-example-range="workDay"><output>${d}</output></div><div class="measure"><b>Первая</b><div class="bartrack"><div class="barfill" style="width:${Math.min(100,a/900*100)}%"></div></div><strong>${a}</strong> сосен</div><div class="measure"><b>Вторая</b><div class="bartrack"><div class="barfill orange" style="width:${Math.min(100,b/900*100)}%"></div></div><strong>${b}</strong> сосен</div><p class="live-notice">Первая работала ${d+1} дн., вторая — ${d} дн. ${a>b?'Первая пока впереди на '+(a-b)+' сосен.':a===b?'Результаты равны!':'Вторая теперь впереди на '+(b-a)+' сосен.'}</p><div class="toolbar"><button class="btn subtle" data-action="work-back" ${!d?'disabled':''}>← Один день назад</button><button class="btn subtle" data-action="work-next" ${d>=10?'disabled':''}>Один день вперёд →</button><button class="btn subtle" data-action="work-reset">Повторить</button></div><div class="compact-line"><label class="field">Через сколько дней работы второй бригады сравняются результаты?<input class="prediction" style="max-width:290px" type="text" inputmode="numeric" data-example-field="workGuess" value="${safe(S.example.workGuess)}" placeholder="Предскажи"></label><div class="toolbar"><button class="btn tiny" data-action="work-check">Проверить прогноз</button></div>${S.example.workReport?`<div class="feedback ${S.example.workOk?'':'error'}">${safe(S.example.workReport)}</div>`:''}</div></div>`}
function iceModel(){let q=+S.example.iceCount||0;return `<div class="lab" id="iceModel"><div class="lab-title">Модель 3 · Ёжик покупает мороженое</div><p>За 7 мороженых сдача 150 ропиков, за 10 мороженых — 105. Сначала найдём цену одного, затем откроем ползунок покупок.</p><div class="threecol"><div class="stat"><small>7 мороженых</small><strong>150</strong><small>ропиков сдачи</small></div><div class="stat"><small>10 мороженых</small><strong>105</strong><small>ропиков сдачи</small></div><div class="stat"><small>Разница в сдаче</small><strong>45</strong><small>ропиков за 3 шт.</small></div></div><div class="compact-line"><label class="field">Цена одного мороженого, ропиков<input type="text" inputmode="numeric" style="max-width:240px" data-example-field="iceGuess" value="${safe(S.example.iceGuess)}" placeholder="Введи цену"></label><div class="toolbar"><button class="btn tiny" data-action="ice-check">Проверить и открыть модель</button></div>${S.example.iceReport?`<div class="feedback ${S.example.iceOk?'':'error'}">${safe(S.example.iceReport)}</div>`:''}</div>${S.example.iceUnlocked?`<div class="compact-line"><p><strong>Открыта модель:</strong> всего 7 · 15 + 150 = 255 ропиков. Меняй количество мороженых.</p><div class="model-input"><label for="iceRange">Мороженых</label><input id="iceRange" type="range" min="0" max="17" step="1" value="${q}" data-example-range="iceCount"><output>${q}</output></div><div class="formula">255 − ${q} · 15 = ${255-q*15} ропиков</div><div class="toolbar"><button class="btn subtle" data-action="ice-back" ${q===0?'disabled':''}>← Убрать одно</button><button class="btn subtle" data-action="ice-next" ${q===17?'disabled':''}>Купить одно →</button><button class="btn subtle" data-action="ice-reset">Вернуть 7 штук</button></div><p class="live-notice">${q===17?'Все 255 ропиков потрачены; 18-е мороженое уже не купить.':'Можно ли купить ещё? Сравни остаток с ценой 15 ропиков.'}</p></div>`:''}</div>`}
const EXP=[
{id:'cut',tab:'Листочки',title:'Один лист — три части',sub:'Разрезаем отдельные листочки и считаем, почему каждый раз число кусочков увеличивается на два.',sideTitle:'Разбираемся без спешки',side:'Когда один целый лист разрезают на три части, вместо одного предмета становятся три. Прибавка равна 3 − 1 = 2. Поэтому считаем не новые части, а увеличение.',formula:'прибавка = (3 − 1) × листов',tip:'При разрезании одного листа на три части число кусочков вырастает на два.',quiz:'P17'},
{id:'log',tab:'Распилы',title:'Один распил — одна новая часть',sub:'Начинаем с одного целого бревна. Нажимай на пилу и смотри, что меняется.',sideTitle:'Разбираемся без спешки',side:'До распила: одна часть. После 1 распила: две части. После 2 — три. После 3 — четыре. Каждый следующий распил разделяет один существующий кусок на два.',formula:'частей = распилов + 1',tip:'Распилов не столько же, сколько частей. Частей всегда на одну больше.',quiz:'X001'},
{id:'work',tab:'Бригады',title:'Как одна бригада догоняет другую',sub:'Первая бригада начала на день раньше. Вторая работает быстрее. Сравни результаты по дням.',sideTitle:'Что означает «догоняет»?',side:'Первая бригада получила фору 80 сосен. В каждый общий рабочий день вторая спиливает на 10 сосен больше. Значит, она уменьшает отставание на 10 сосен в день.',formula:'дни = 80 : (90 − 80)',tip:'Не путай 8 дней работы второй бригады и 9 дней первой.',quiz:'P06'},
{id:'ice',tab:'Мороженое',title:'Находим цену по разнице сдачи',sub:'Ёжик купил разные количества одинакового мороженого. По сдаче выясним цену одной штуки.',sideTitle:'За что заплатили больше?',side:'Покупка 10 мороженых вместо 7 — это ещё 3 штуки. Сдачи осталось на 45 ропиков меньше, значит, три штуки стоят ровно 45.',formula:'цена = (150 − 105) : (10 − 7)',tip:'Разность оставшихся денег соответствует стоимости ДОПОЛНИТЕЛЬНЫХ трёх мороженых.',quiz:'P13'},
{id:'S1',tab:'Весы',title:'Узнаём массы по парным взвешиваниям',sub:'Передвигай ползунки масс и добейся правильных показаний на всех трёх весах.',sideTitle:'Сравни две пары',side:'Нюша с Ёжиком весят столько же, сколько Крош с Ёжиком. Масса Ёжика в обоих случаях одинакова. Значит, Нюша и Крош весят одинаково.',formula:'30 : 2 = 15 кг',tip:'Если два равных результата содержат общий предмет, сравни остальные предметы.',quiz:'P04'},
{id:'S5',tab:'Конфеты',title:'Каждая ошибка меняет результат',sub:'Крош получает конфеты за верные ответы и теряет за ошибки. Выясни, сколько верных ответов было.',sideTitle:'Что происходит при ошибке?',side:'Если бы Крош ответил верно, он получил бы 4 конфеты. Ошибка вместо этого отнимает 6. Разница между двумя исходами — целых 10 конфет.',formula:'одна ошибка = 4 + 6 потерь',tip:'Нужно учитывать и несостоявшуюся награду, и настоящий штраф.',quiz:'X043'},
{id:'S8',tab:'Упаковки',title:'Собери нужное количество карандашей',sub:'Выбирай упаковки кнопками «+» и «−». Найди ровно 153 карандаша и объясни, почему ответ единственный.',sideTitle:'Как доказать все варианты?',side:'Сначала установи число упаковок: семи не хватит, а девять дадут слишком много. Следовательно, нужно восемь. Восемь по 19 дают 152, до 153 не хватает одного.',formula:'8 × 19 + 1 = 153',tip:'Требуется не только найти подходящий набор, но и исключить все остальные.',quiz:'X061'}
];
function logModel(){const n=Math.max(0,Math.min(20,+S.logCuts||0));let parts=n+1;return `<div class="lab log-lab" id="logModel"><div class="lab-title">🪚 Волшебное бревно</div><p>Каждый щелчок по кнопке «Распилить» делит один кусок на два. Кусочков становится на один больше.</p><div class="wood-board" aria-label="Бревно из ${parts} частей, ${n} распилов" role="img">${Array.from({length:parts},(_,i)=>`<div class="wood-part" style="min-width:0"><span>${i+1}</span></div>`).join('')}</div><div class="wood-note">Разделительные полоски обозначают распилы</div><div class="exp-stats"><div><strong>1</strong><span>БЫЛО ЧАСТЕЙ</span></div><div><strong>${n}</strong><span>РАСПИЛОВ</span></div><div><strong>${parts}</strong><span>СТАЛО ЧАСТЕЙ</span></div></div><div class="toolbar"><button class="btn" data-action="logcut" ${n===20?'disabled':''}>🪚 Сделать распил</button><button class="btn subtle" data-action="logundo" ${n===0?'disabled':''}>↶ Назад</button><button class="btn subtle" data-action="logreset">↻ Новое бревно</button></div><div class="exp-model-feedback">После <strong>${n}</strong> распилов получилось <strong>${parts}</strong> частей.${S.logNotice?' '+safe(S.logNotice):''}</div></div>`}
function logMiniCard(){const a=S.logMiniResult,attempts=S.logMiniAttempts||0,h=S.logMiniHint||0;return `<article class="card task-card" id="logMiniCard"><div class="head"><div><div class="task-meta">Дополнительная мини-задача · новое условие</div><h3>Сколько частей получится?</h3></div>${a==='ok'?'<span class="tag">✓ Верно</span>':'<span class="tag gray">Попробуй сам</span>'}</div><div class="question"><strong>Бурундучки сделали 20 распилов одного бревна. Сколько частей получилось?</strong></div><div class="inputgrid"><label class="field">Твой ответ, частей<input type="text" inputmode="numeric" data-logmini value="${safe(S.logMini||'')}" placeholder="Введи число" autocomplete="off"></label></div><div class="toolbar"><button type="button" class="btn" data-action="log-mini-check">Проверить ответ</button><button type="button" class="btn line" data-action="log-mini-hint" ${h>=3?'disabled':''}>Подсказка ${Math.min(3,h+1)}/3</button><button type="button" class="btn subtle" data-action="log-mini-reveal" ${attempts===0?'disabled':''}>${S.logMiniReveal?'Скрыть решение':'Показать решение'}</button></div>${a?`<div class="feedback ${a==='ok'?'':'error'}" role="status">${a==='ok'?'Верно! 20 распилов создают 21 часть: каждый новый распил добавляет одну.':'Посмотри на бревно: после 0 распилов 1 часть, после 1 — две. Проверь, какую прибавку даёт каждый следующий распил. Введённый ответ сохранён.'}</div>`:''}${h?`<div class="details"><b>Подсказки:</b>${['Сравни число распилов и число частей на рисунке выше.','После 3 распилов получится 4 части. В чём закономерность?','Начинаем с 1 целого бревна, каждый распил даёт +1 часть, поэтому 1 + 20.'].slice(0,h).map((txt,i)=>`<p>${i+1}. ${txt}</p>`).join('')}</div>`:''}${S.logMiniReveal&&attempts?'<div class="details"><b>Решение:</b> Было 1 целое бревно. Каждый из 20 распилов добавляет ровно 1 часть. Всего 1 + 20 = 21 часть.</div>':''}</article>`}
function examplesPage(){const id=S.expCurrent||'log',index=Math.max(0,EXP.findIndex(x=>x.id===id)),x=EXP[index],done=Object.values(S.expDone||{}).filter(Boolean).length;
const model= x.id==='cut'?cutModel():x.id==='log'?logModel():x.id==='work'?workModel():x.id==='ice'?iceModel():labPanel(x.id);
const q=DATA.practice.find(t=>t.id===x.quiz);
return `<div class="exp-head"><div><h1>Сначала пойми — потом решай</h1><p>Выбирай опыт, нажимай на кнопки и смотри, как появляется ответ. Затем реши маленькую задачу.</p></div><span class="exp-counter">${done} / 7 опытов пройдено</span></div>
<div class="experience-tabs" role="tablist" aria-label="Выбери математический опыт">${EXP.map((e,i)=>`<button type="button" role="tab" aria-selected="${x.id===e.id}" data-exp="${e.id}" class="exp-tab ${x.id===e.id?'active':''}">${i+1}. ${safe(e.tab)} ${S.expDone[e.id]?'✓':''}</button>`).join('')}</div>
<article class="card experience-card"><div class="exp-topline"><span class="eyebrow">ОПЫТ ${index+1} ИЗ 7</span><button type="button" class="exp-done ${S.expDone[x.id]?'checked':''}" data-action="expdone" aria-pressed="${!!S.expDone[x.id]}">${S.expDone[x.id]?'✓ Пройдено':'○ Отметить пройденным'}</button></div><h2>${safe(x.title)}</h2><p class="exp-subtitle">${safe(x.sub)}</p>
<div class="exp-grid"><section class="exp-model">${model}</section><aside class="exp-aside"><h3>${safe(x.sideTitle)}</h3><p>${safe(x.side)}</p><div class="exp-formula">${safe(x.formula)}</div><div class="exp-tip"><strong>Подсказка</strong><span>${safe(x.tip)}</span></div><p class="exp-instruction"><b>Как заниматься:</b> используй модель слева, наблюдай за результатом и попробуй объяснить его своими словами. Потом реши вопрос ниже.</p></aside></div></article>
<div class="exp-check"><div class="eyebrow">🎯 ТВОЯ ОЧЕРЕДЬ · МИНИ-ПРОВЕРКА ${index+1} ИЗ 7</div><p class="muted">Это новая тренировочная задача — реши её после эксперимента.</p>${x.id==='log'?logMiniCard():taskCard(q)}<div class="exp-follow"><button type="button" class="btn subtle" data-action="exp-prev" ${index===0?'disabled':''}>← Предыдущий опыт</button><button type="button" class="btn" data-action="exp-next" ${index===EXP.length-1?'disabled':''}>Следующий опыт →</button></div></div>
<div class="exp-links"><button class="btn subtle" data-go="start">Разминка и план занятия</button><button class="btn line" data-go="sources">Перейти к 8 исходным задачам →</button><button class="btn subtle" data-go="final">Итоговая проверка</button><button class="btn subtle" data-go="homework">Домашняя работа</button></div>`;}

function getL(id,key,initial){return S.labs[id]?.[key]??initial}
function initLab(id){if(!S.labs[id])S.labs[id]={};}
function labRange(id,key,label,min,max,init,step=1){let v=getL(id,key,init);return `<div class="model-input"><label for="rng_${id}_${key}">${safe(label)}</label><input id="rng_${id}_${key}" type="range" data-lab="${id}" data-lab-key="${key}" min="${min}" max="${max}" step="${step}" value="${v}"><output data-lab-val="${key}">${v}</output></div>`}
function labOutput(id){const v=(k,init)=>+getL(id,k,init);switch(id){
case 'S1':{let n=v('n',12),k=v('k',14),e=v('e',19);return `<div class="threecol"><div class="stat"><small>Нюша + Крош · цель 30</small><strong>${n+k}</strong><small>${n}+${k}</small></div><div class="stat"><small>Нюша + Ёжик · цель 35</small><strong>${n+e}</strong><small>${n}+${e}</small></div><div class="stat"><small>Крош + Ёжик · цель 35</small><strong>${k+e}</strong><small>${k}+${e}</small></div></div><p class="live-notice">${n+k===30&&n+e===35&&k+e===35?'Все три условия выполняются. Теперь объясни, почему решение единственное.':'Подбирай массы так, чтобы ВСЕ три суммы совпали с условиями.'}</p>`}
case 'S2':{let n=v('n',5);return `<p>Тетрадка — <b>${n}</b>, ручка — <b>${4*n}</b>, блокнот — <b>${16*n}</b> ропиков.</p><div class="formula">${n} + 2 · ${4*n} + ${16*n} = ${25*n}</div><p class="live-notice">Условие требует ровно 200 ропиков. Каждая покупка равна 25 «частям-тетрадкам».</p>`}
case 'S3':{let w=v('w',22);return `<div class="threecol"><div class="stat"><small>Два велосипедных пути</small><strong>20</strong><small>мин</small></div><div class="stat"><small>Пешком + велосипед</small><strong>${w+10}</strong><small>мин · цель 40</small></div><div class="stat"><small>Два пеших пути</small><strong>${w*2}</strong><small>мин</small></div></div><p class="live-notice">Один велосипедный путь занимает 10 минут. Меняй время одного пешего пути и найди вариант, где смешанная поездка длилась 40 минут.</p>`}
case 'S4':{let r=v('r',60);return `<div class="twocol"><div><div class="measure"><b>Нюша 5×4</b><div class="bartrack"><div class="barfill" style="width:71.43%"></div></div><strong>20 м²</strong></div><div class="measure"><b>Крош 7×4</b><div class="bartrack"><div class="barfill orange" style="width:100%"></div></div><strong>28 м²</strong></div></div><div><div class="stat"><small>Разница в плате · цель 800</small><strong>${8*r} роп.</strong><small>8 м² × ${r} роп./м²</small></div></div></div><p class="live-notice">Когда разница станет 800 ропиков, умножь выбранную цену одного квадратного метра на 20 + 28 м².</p>`}
case 'S5':{let c=v('c',10),wrong=20-c,result=100+4*c-6*wrong;return `<div class="threecol"><div class="stat"><small>Правильных</small><strong>${c}</strong></div><div class="stat"><small>Ошибок</small><strong>${wrong}</strong></div><div class="stat"><small>Конфет · цель 120</small><strong>${result}</strong></div></div><div class="formula">100 + ${c} · 4 − ${wrong} · 6 = ${result}</div><p class="live-notice">Сумма верных и ошибочных ответов всегда равна 20. Подбирай количество правильных ответов.</p>`}
case 'S6':{let n=v('n',0),k=v('k',0);return `<div class="threecol"><div class="stat"><small>Нюша заплатила после возврата</small><strong>${250-n}</strong><small>ропиков</small></div><div class="stat"><small>Крош заплатил после возврата</small><strong>${350-k}</strong><small>ропиков</small></div><div class="stat"><small>Бараш передал</small><strong>${n+k}</strong><small>ропиков</small></div></div><p class="live-notice">Сумма трат 600 ропиков не меняется. Цель — все три числа равны 200.</p>`}
case 'S7':{let slow=v('slow',2),car=v('car',5),returnFactor=slow/2+1/(2*car);return `<div class="threecol"><div class="stat"><small>В деревню</small><strong>1</strong><small>единица времени</small></div><div class="stat"><small>Половина обратно пешком</small><strong>${String((slow/2).toFixed(3)).replace(/\.?0+$/,'')}</strong><small>в ${slow} раза медленнее</small></div><div class="stat"><small>Вторая половина на машине</small><strong>${String((1/(2*car)).toFixed(3)).replace(/\.?0+$/,'')}</strong><small>в ${car} раз быстрее</small></div></div><div class="formula">Время обратно ≈ ${String(returnFactor.toFixed(3)).replace(/\.?0+$/,'')} времени туда</div><p class="live-notice">${returnFactor>1?'Назад дольше.':returnFactor===1?'Время одинаково.':'Назад быстрее.'} Это опыт с разными скоростями, в исходном условии множители 2 и 5.</p>`}
case 'S8':{let a=v('a',0),b=v('b',0),c=v('c',0),count=a+b+c,tot=a*19+b*20+c*21;return `<div class="pack-nums">${[[19,'a',a],[20,'b',b],[21,'c',c]].map(([s,k,val])=>`<div class="pack-controls"><div class="muted" style="font-size:12px">По ${s} штук</div><strong>${val}</strong><button data-action="packstep" data-pack="${k}" data-delta="-1" aria-label="Убрать упаковку по ${s}" ${val<=0?'disabled':''}>−</button> <button data-action="packstep" data-pack="${k}" data-delta="1" aria-label="Добавить упаковку по ${s}" ${count>=9?'disabled':''}>+</button></div>`).join('')}</div><div class="laboutput"><div class="num">${tot} <span style="font-size:14px">из 153 карандашей</span></div><p>Упаковок: <b>${count}</b>. ${tot===153?'Количество верное. Сможешь доказать, что другой набор невозможен?':tot<153?'Не хватает '+(153-tot)+' карандашей.':'Лишние '+(tot-153)+' карандашей.'}</p></div>`}
default:return ''}}
function labPanel(id){let hints={'S1':'Передвинь значения масс и проверь все три показания весов.','S2':'Один ползунок задаёт цену тетрадки; остальные цены связаны с ней.','S3':'Один велосипедный путь занимает 10 минут. Подбери время одного пешего пути.','S4':'Площади потолков не меняются; подбирай цену покраски 1 м².','S5':'Изменяй число верных ответов; число ошибок пересчитывается автоматически.','S6':'Бараш возвращает деньги двум друзьям. Найди справедливое распределение.','S7':'Измени скорость Пина и машины; сравни времена одного и того же расстояния.','S8':'Собери ровно 153 карандаша кнопками плюс и минус. Затем докажи единственность.'}[id];return `<section class="lab" id="lab_${id}"><div class="lab-title">Интерактивная лаборатория · ${safe(hints)}</div>${id==='S1'?labRange(id,'n','Нюша, кг',5,30,12)+labRange(id,'k','Крош, кг',5,30,14)+labRange(id,'e','Ёжик, кг',5,30,19):''}${id==='S2'?labRange(id,'n','Тетрадка, роп.',1,15,5):''}${id==='S3'?labRange(id,'w','Пешком в одну сторону, мин',10,50,22):''}${id==='S4'?labRange(id,'r','Цена м², роп.',20,200,60,5):''}${id==='S5'?labRange(id,'c','Правильных ответов',0,20,10):''}${id==='S6'?labRange(id,'n','Вернуть Нюше',0,200,0,10)+labRange(id,'k','Вернуть Крошу',0,200,0,10):''}${id==='S7'?labRange(id,'slow','Во сколько раз медленнее',1,4,2)+labRange(id,'car','Во сколько раз быстрее машина',2,8,5):''}<div data-lab-output>${labOutput(id)}</div>${id==='S8'?'<div class="toolbar"><button class="btn subtle tiny" data-action="packreset">Собрать с начала</button></div>':''}</section>`}
function taskResult(t){const st=S.statuses[t.id];if(st==='independent')return '<span class="tag">✓ Решено самостоятельно</span>';if(st==='help')return '<span class="tag orange">✓ Решено с помощью</span>';return '<span class="tag gray">Не решено</span>'}
function taskFields(t){if(t.type==='number')return `<div class="inputgrid">${t.fields.map(f=>`<label class="field">${safe(f.label)}<input data-answer="${t.id}" data-key="${f.key}" inputmode="decimal" type="text" autocomplete="off" value="${safe(S.answers[t.id]?.[f.key]??'')}" placeholder="Твой ответ" aria-label="${safe(f.label)}"></label>`).join('')}</div>`;if(t.type==='choice')return `<div class="choice-list" role="radiogroup" aria-label="Выбери ответ">${t.choices.map(c=>`<label class="choice"><input type="radio" name="answer_${t.id}" data-answer="${t.id}" data-key="selected" value="${safe(c.v)}" ${S.answers[t.id]?.selected===c.v?'checked':''}><span>${safe(c.t)}</span></label>`).join('')}</div>`;return `<label class="field" style="margin-top:20px">Твоё объяснение<textarea data-answer="${t.id}" data-key="text" rows="5" placeholder="Запиши последовательные доводы. Обязательно поясняй, что означает каждое число.">${safe(S.answers[t.id]?.text||'')}</textarea></label>`}
function resultHtml(t){const st=S.statuses[t.id],error=S.attempts[t.id]>0&&!st; if(st)return `<div role="status" class="feedback"><strong>Верно! ${st==='independent'?'Решено самостоятельно.':'Решено с помощью.'}</strong><div>Важен не только ответ: объясни вслух, что означает каждое действие.</div></div>`;if(error)return `<div role="status" class="feedback error"><strong>Пока не всё совпало с условием.</strong><div>${safe(S.errorDetails?.[t.id]||t.why||'Проверь вычисления и смысл полученного числа.')}</div><div>Попробуй ещё раз. Введённые ответы сохранены.</div></div>`;return ''}
function taskCard(t,opts={}){const tries=S.attempts[t.id]||0,h=S.hints[t.id]||0,rev=S.reveals[t.id],isSource=opts.source;return `<article class="card task-card" id="task_${t.id}"><div class="head"><div><div class="task-meta">${isSource?'Исходное задание · PDF стр. '+(parseInt(t.id.slice(1))<=8?(parseInt(t.id.slice(1))<=8?3:3):3):t.id.startsWith('F')?'Итоговая задача · новые числа':'Дополнительная задача · '+(t.difficulty||'Средний')+' уровень · '+(t.topic||'Разное')}</div><h3>${safe(t.title)}</h3></div>${taskResult(t)}</div><div class="question">${safe(t.text)}</div>${isSource?labPanel(t.id):''}${t.id==='S8'||t.id==='P20'?'<div class="note orange" style="margin-top:15px"><strong>На бумаге:</strong> кроме ответа докажи, что других вариантов нет.</div>':!t.id.startsWith('F')?'<div class="live-notice">Бумага: запиши действия с коротким пояснением каждого полученного числа.</div>':''}${taskFields(t)}<div class="toolbar"><button class="btn" data-action="check" data-id="${t.id}">${t.type==='reason'?'Сверить по критериям':'Проверить ответ'}</button><button class="btn line" data-action="hint" data-id="${t.id}" ${h>=3?'disabled':''}>Подсказка ${h+1}/3</button><button class="btn subtle" data-action="reveal" data-id="${t.id}" ${!tries&&!S.teacher?'disabled':''}>${rev||S.teacher?'Скрыть / показать решение':'Показать решение'}</button></div>${!tries?'<p class="help-level">Полное решение доступно после первой попытки. Подсказки открываются по одной.</p>':`<p class="help-level">Попыток: ${tries}. ${h?'Подсказок открыто: '+h+'.':'Без подсказок.'}</p>`}${resultHtml(t)}${h?`<div class="details"><strong>Подсказки:</strong>${t.hints.slice(0,h).map((x,i)=>`<p style="margin:9px 0">${i+1}. ${safe(x)}</p>`).join('')}</div>`:''}${t.type==='reason'&&tries?`<div class="details"><strong>Сверь объяснение самостоятельно — автоматическая проверка доказательства не проводится.</strong>${t.rubric.map((x,i)=>`<label class="checkline"><input type="checkbox" data-rubric="${t.id}" data-index="${i}" ${S.answers[t.id]?.['rubric'+i]?'checked':''}><span>${safe(x)}</span></label>`).join('')}<div class="toolbar"><button class="btn line" data-action="selfmark" data-id="${t.id}">Все критерии выполнены — отметить</button></div></div>`:''}${(rev||S.teacher&&S.teacherSolution===t.id)?`<div class="details"><strong>Пошаговое решение.</strong><p style="margin:6px 0">${safe(t.solution)}</p><strong>На что обратить внимание:</strong> ${safe(t.why||'Смысл действий.')}</div>`:''}</article>`}
function sourcesPage(){return `${header('Задачи из PDF · № 1–8','Теперь решаешь ты','Исходные условия, числа и нумерация сохранены. Рядом с каждой задачей есть действующая модель, но окончательный ответ нужно записать самому.')}
<div class="note"><strong>Приём для любой задачи:</strong> 1) что известно; 2) что ищем; 3) что означает каждое действие; 4) подходит ли ответ ко всем условиям.</div><div class="section-head"><div><h2>Исходный лист: 8 задач</h2><p>Сначала попробуй без подсказки. При ошибке данные в полях не пропадают.</p></div><span class="tag">${DATA.sources.filter(t=>S.statuses[t.id]).length} из 8</span></div>${DATA.sources.map(t=>taskCard(t,{source:true})).join('')}${foot('examples','practice')}`}
const practiceTopics=["Листы и изменение", "Работа", "Покупки", "Движение", "Площадь", "Логика и конфеты", "Равные доли", "Перебор наборов", "Массы и сравнение", "Магазин и сдача"];
function practiceFiltered(){let f=S.filters||defaults().filters;return DATA.practice.filter(t=>(f.topic==='all'||t.topic===f.topic)&&(f.difficulty==='all'||t.difficulty===f.difficulty)&&(f.status==='all'||(f.status==='solved'?!!S.statuses[t.id]:!S.statuses[t.id])))}
const opts=(values,current)=>values.map(([v,t])=>`<option value="${safe(v)}" ${v===current?'selected':''}>${safe(t)}</option>`).join('');
function practicePage(){const f=S.filters,all=practiceFiltered(),count=10,max=Math.max(1,Math.ceil(all.length/count));f.page=Math.min(Math.max(f.page||1,1),max);const group=all.slice((f.page-1)*count,f.page*count);return `${header('Практика · 100 заданий','Большой тренажёр','Десять математических тем: изменение количества, работа, стоимость, движение, площади, очки, справедливые доли, перебор, массы и покупки. Выбери сложность и тип задания.')}
<div class="card practice-controls"><div class="filters"><label class="field">Тема<select data-filter="topic" aria-label="Тема тренажёра">${opts([['all','Все темы'],...practiceTopics.map(x=>[x,x])],f.topic)}</select></label><label class="field">Сложность<select data-filter="difficulty" aria-label="Сложность тренажёра">${opts([['all','Любая'],['Лёгкий','Лёгкий'],['Средний','Средний'],['Сложный','Сложный']],f.difficulty)}</select></label><label class="field">Статус<select data-filter="status" aria-label="Статус выполнения">${opts([['all','Все задания'],['unsolved','Ещё не решённые'],['solved','Уже решённые']],f.status)}</select></label></div><div class="toolbar"><button class="btn line" data-action="random">Случайная задача из выбранных</button><button class="btn subtle" data-action="clearfilters">Сбросить фильтры</button><span class="muted" style="font-size:13px">Найдено: ${all.length} из ${DATA.practice.length} · Решено: ${DATA.practice.filter(t=>S.statuses[t.id]).length}</span></div></div>
<div class="note orange">Если задача требует доказательства, оценка выполняется по чек-листу, а не автоматическим анализом текста. Для всех остальных типов проверка ответа автоматическая.</div>${group.length?group.map(t=>taskCard(t)).join(''):'<div class="card"><p>По этим фильтрам заданий нет. Выбери другой уровень или статус.</p></div>'}
<div class="pager"><button class="btn subtle" data-action="page-prev" ${f.page<=1?'disabled':''}>← Назад</button><span>Страница <strong>${f.page}</strong> из ${max}</span><button class="btn line" data-action="page-next" ${f.page>=max?'disabled':''}>Вперёд →</button></div>${foot('sources','summary')}`}
function summaryPage(){return `${header('Повтори и проверь понимание','Шпаргалка и итоги','Не заучивай цифры: проверь, можешь ли объяснить смысл каждого действия.')}
<div class="card"><h2>Шесть мыслей, которые помогают решать</h2><div class="twocol">${[
['Изменение количества','Если один предмет заменили k предметами, изменение равно k − 1. Нужно выяснить, сколько таких замен было.'],
['Работа','Работа = производительность × время. Вычитание двух скоростей показывает, сколько одна бригада догоняет за единицу времени.'],
['Равные части','Вместо разных предметов или цен введи одинаковые условные части. Сосчитай их количество, затем найди стоимость одной.'],
['Движение','Для одного и того же расстояния быстрее означает меньше времени. В сложной поездке складывай времена участков.'],
['Справедливые расходы','Найди общую сумму, затем равную долю. Возврат каждому равен его переплате сверх доли.'],
['Все варианты','Сначала докажи границы числа предметов. Затем возьми минимальные упаковки и распределяй необходимую добавку.']].map(([t,v])=>`<div class="stat" style="margin-bottom:12px"><h3>${t}</h3><p>${v}</p></div>`).join('')}</div></div>
<div class="card"><h2>Личный результат</h2><div class="progress-panel"><div><strong>${solved()} / ${possible}</strong>Принято задач</div><div><strong>${Object.values(S.statuses).filter(x=>x==='independent').length}</strong>Самостоятельно</div><div><strong>${Object.values(S.statuses).filter(x=>x==='help').length}</strong>С помощью</div></div><p>Попробуй объяснить одну решённую задачу так, чтобы другой ребёнок понял, что означает каждое число.</p></div>
<div class="toolbar"><button class="btn" data-go="final">Перейти к итоговой проверке →</button><button class="btn subtle" data-action="reset">Сбросить все результаты</button></div>${foot('practice','final')}`}
function finalPage(){const n=DATA.finals.filter(t=>S.statuses[t.id]).length;return `${header('Проверка знаний · новые условия','Проверь, понял ли ты','Здесь другие числа и другие ситуации. Сначала попробуй без подсказок, чтобы результат показал именно твоё понимание.')}
<div class="card"><h3>Твой результат финальной проверки</h3><div class="progress-panel"><div><strong>${n}/5</strong>Решено</div><div><strong>${DATA.finals.filter(t=>S.statuses[t.id]==='independent').length}</strong>Самостоятельно</div><div><strong>${DATA.finals.filter(t=>S.statuses[t.id]==='help').length}</strong>С помощью</div></div><p class="muted" style="font-size:13px">Задача № 5 требует также объяснения на бумаге. Числовой ответ проверяется автоматически; полнота доказательства — по критериям преподавателя.</p></div>${DATA.finals.map(t=>taskCard(t)).join('')}${foot('summary','homework')}`}
function homeworkPage(){return `${header('На бумаге · 5 задач','Домашняя работа','Печатается отдельным листом формата A4: только условия и место для решений, без ответов, меню и интерактивных подсказок.')}
<div class="toolbar"><button class="btn" data-action="print">Распечатать только домашнее задание ↗</button><button class="btn line" data-action="copyhw">Скопировать условия</button></div><div style="margin-top:20px">${homePaperMarkup(false)}</div>${foot('final',S.teacher?'teacher':'start')}`}
function teacherPage(){return `${header('Служебный режим · преподавателю','Методические материалы','Полные ответы, план занятия, вопросы ребёнку и способы реагировать на характерные ошибки. Режим виден только при включении переключателя.')}
<div class="twocol"><div class="card"><h2>План на 90 минут</h2><div class="timeline">${[['00–07','Устный счёт, площадь, смысл прибавки.'],['07–25','Модели бумаги, производительности, сдачи.'],['25–50','Три исходных примера; уточнять смысл каждого действия.'],['50–70','Задачи 1–6, направляющие вопросы.'],['70–82','Практика: 4–6 задач по уровню.'],['82–87','Итог: 1–2 новые задачи без помощи.'],['87–90','Обсуждение результата и выдача ДЗ.']].map(([t,d])=>`<div class="timeitem"><b>${t}</b><span>${d}</span></div>`).join('')}</div><p class="muted">Темп примерный. Задачи № 7 и № 8 и часть практики допускается перенести на следующее занятие.</p></div><div class="card"><h2>Алгоритм вопросов</h2><p>«Что у нас уже было? Что изменилось? Почему это число нужно сложить или разделить? Какие единицы измерения получились? Чем проверишь ответ?»</p><p><strong>Бумага:</strong> пусть ребёнок подписывает смысл у каждого числа: «прибавка в кусочках», «скорость догоняния», «стоимость одного метра».</p><h3>Частые ошибки</h3><p>Считать прибавку от разрезанного листа как 3, а не 2; делить 35 кг пополам без основания; путать «дней первой» и «дней второй»; делить возврат за обед поровну; назвать один вариант в задаче на все наборы без доказательства.</p></div></div>
<div class="card"><h2>Шпаргалка к трём исходным примерам</h2><p><strong>1.</strong> «Каждый разрезанный лист вместо одной бумажки даёт три: прибавка две». Ответ: <b>6 листов</b>.</p><p><strong>2.</strong> «Первая получает фору 80, вторая догоняет по 10 в день». Ответ: <b>1440 сосен</b>.</p><p><strong>3.</strong> «За три дополнительных мороженых отдают ещё 45». Цена 15, максимум <b>17 мороженых</b>.</p></div>
<div class="card"><h2>Решения всех исходных задач</h2>${DATA.sources.map(t=>`<details class="details"><summary><strong>${safe(t.title)}</strong></summary><p>${safe(t.solution)}</p><p class="muted"><strong>Риск ошибки:</strong> ${safe(t.why)}</p><p><strong>Спроси ребёнка:</strong> ${safe(t.hints[0])}</p></details>`).join('')}</div><div class="card"><h2>Ответы на новую практику</h2><div class="twocol">${DATA.practice.map(t=>`<div class="tile" style="display:block"><b>${safe(t.id)}.</b> ${safe(t.title)}<small>${safe(t.solution)}</small></div>`).join('')}</div></div><div class="card"><h2>Итоговая проверка и критерии</h2>${DATA.finals.map(t=>`<p><strong>${safe(t.title)}.</strong> ${safe(t.solution)}</p>`).join('')}<p><strong>Критерии доказательств:</strong> обе границы числа упаковок, переход к базовым одинаковым коробкам, расчёт добавки, исключение других вариантов. Текст оценивается учителем, не алгоритмом.</p></div><div class="card"><h2>Домашние ответы — не выводятся на печать</h2>${DATA.homework.map(([n,,a])=>`<p><strong>${n}.</strong> ${safe(a)}</p>`).join('')}</div><div class="toolbar"><button class="btn subtle" data-action="reset">Сбросить прогресс ребёнка</button></div>${foot('homework','start')}`}
function render(){updateNav();let r=route(),main=document.getElementById('main');main.innerHTML=({start:startPage,examples:examplesPage,sources:sourcesPage,practice:practicePage,summary:summaryPage,final:finalPage,homework:homeworkPage,teacher:teacherPage}[r]||startPage)();document.getElementById('printHomework').innerHTML=homePaperMarkup(true)}
const findTask=id=>[...DATA.sources,...DATA.practice,...DATA.finals].find(t=>t.id===id);
function parseNum(x){let v=String(x??'').trim().replace(/\s+/g,'').replace(',','.').replace('−','-');if(!v)return NaN;if(/^[-+]?\d+(?:\.\d+)?\/[-+]?\d+(?:\.\d+)?$/.test(v)){let [a,b]=v.split('/').map(Number);return b? a/b:NaN}return /^[-+]?\d+(\.\d+)?$/.test(v)?Number(v):NaN}
function checkTask(id){let t=findTask(id);if(!t)return;let a=S.answers[id]||{},hasInput=t.type==='number'?t.fields.some(f=>String(a[f.key]||'').trim()!==''):t.type==='choice'?!!a.selected:String(a.text||'').trim().length>0;if(!hasInput){const node=document.querySelector('#task_'+id+' .toolbar');if(node){let old=node.parentElement.querySelector('.empty-warning');if(old)old.remove();let el=document.createElement('div');el.className='feedback error empty-warning';el.textContent='Сначала введи ответ или своё объяснение, затем проверь.';node.after(el)}return}S.attempts[id]=(S.attempts[id]||0)+1;S.errorDetails=S.errorDetails||{};if(t.type==='reason'){S.errorDetails[id]='Автоматически проверить свободное доказательство нельзя. Сверь написанное с четырьмя критериями ниже.';save();replaceTask(id);return}let wrong=[];if(t.type==='number')for(const f of t.fields){let x=parseNum(a[f.key]);if(!Number.isFinite(x)||Math.abs(x-f.ans)>1e-8)wrong.push(f.label)}else if(a.selected!==t.answer)wrong.push('выбранный вариант');if(!wrong.length){S.statuses[id]=(S.hints[id]||S.reveals[id])?'help':'independent';delete S.errorDetails[id]}else{delete S.statuses[id];S.errorDetails[id]=`Проверь: ${wrong.join(', ')}. ${t.why||'Вернись к условию и проверь действия.'}`}save();replaceTask(id);updateNav()}
function replaceTask(id){let old=document.getElementById('task_'+id),t=findTask(id);if(old&&t){const div=document.createElement('div');div.innerHTML=taskCard(t,{source:id.startsWith('S')});old.replaceWith(div.firstElementChild)}}
function warmCheck(id){const w=DATA.warm.find(x=>x.id===id);let v=S.warm[id];if(!w||!v||v.choice===undefined)return;v.checked=true;v.correct=v.choice===w.ans;save();render()}
function selfMark(id){let t=findTask(id);if(!t||t.type!=='reason')return;let a=S.answers[id]||{};if(!t.rubric.every((_,i)=>!!a['rubric'+i])){alert('Отметь каждый критерий, который действительно подтверждён твоим объяснением. Если какой-то не выполняется — допиши доказательство.');return}S.statuses[id]=(S.hints[id]||S.reveals[id])?'help':'independent';save();replaceTask(id);updateNav()}
function updateExample(part){let target={cut:'cutModel',work:'workModel',ice:'iceModel'}[part];let id={cut:'cutModel',work:'workModel',ice:'iceModel'}[part];let old=document.getElementById(id);if(!old)return;const d=document.createElement('div');d.innerHTML=({cut:cutModel,work:workModel,ice:iceModel}[part])();old.replaceWith(d.firstElementChild)}
function eventAction(e){let b=e.target.closest('[data-action]');if(!b)return;let action=b.dataset.action,id=b.dataset.id;switch(action){
case 'log-mini-check':{let v=parseNum(S.logMini);if(!Number.isFinite(v)){let el=document.querySelector('#logMiniCard [data-logmini]');el?.focus();return}S.logMiniAttempts=(S.logMiniAttempts||0)+1;S.logMiniResult=v===21?'ok':'bad';if(v===21){S.expDone=S.expDone||{};S.expDone.log=true;}save();render();document.getElementById('logMiniCard')?.scrollIntoView({block:'nearest'});return}
case 'log-mini-hint':S.logMiniHint=Math.min(3,(S.logMiniHint||0)+1);save();render();document.getElementById('logMiniCard')?.scrollIntoView({block:'nearest'});return;
case 'log-mini-reveal':if(S.logMiniAttempts){S.logMiniReveal=!S.logMiniReveal;save();render();document.getElementById('logMiniCard')?.scrollIntoView({block:'nearest'});}return;
case 'expdone':S.expDone=S.expDone||{};S.expDone[S.expCurrent||'log']=!S.expDone[S.expCurrent||'log'];save();render();return;
case 'exp-prev':case 'exp-next':{let i=EXP.findIndex(x=>x.id===S.expCurrent),d=action==='exp-next'?1:-1;S.expCurrent=EXP[Math.max(0,Math.min(EXP.length-1,i+d))].id;save();render();window.scrollTo({top:0,behavior:'instant'});return}
case 'logcut':case 'logundo':case 'logreset':{let n=Math.max(0,Math.min(20,+S.logCuts||0));S.logCuts=action==='logreset'?0:Math.max(0,Math.min(20,n+(action==='logcut'?1:-1)));S.logNotice=action==='logreset'?'Начали с одного целого бревна.':action==='logundo'?'Последний распил отменён.':'Число частей увеличилось на один.';S.expDone=S.expDone||{};if(action==='logcut')S.expDone.log=true;save();const old=document.getElementById('logModel');if(old){let temp=document.createElement('div');temp.innerHTML=logModel();old.replaceWith(temp.firstElementChild)}else render();updateNav();return}
case 'teacher':S.teacher=!S.teacher;if(!S.teacher&&route()==='teacher'){S.active='start';location.hash='start'}save();render();return;
case 'page-next':S.filters.page++;save();render();document.getElementById('main').scrollIntoView();return;
case 'page-prev':S.filters.page=Math.max(1,S.filters.page-1);save();render();document.getElementById('main').scrollIntoView();return;
case 'random':{const arr=practiceFiltered();if(!arr.length)return;const item=arr[Math.floor(Math.random()*arr.length)];const idx=arr.findIndex(t=>t.id===item.id);S.filters.page=Math.floor(idx/10)+1;save();render();document.getElementById('task_'+item.id)?.scrollIntoView({behavior:'smooth',block:'start'});return}
case 'clearfilters':S.filters={topic:'all',difficulty:'all',status:'all',page:1};save();render();return;
case 'reset':if(confirm('Сбросить ВСЕ ответы, подсказки и прогресс этого урока в данном браузере?')){let teacher=S.teacher;S=defaults();S.teacher=teacher;save();navigate('start');render()}return;
case 'warmcheck':warmCheck(id);return;
case 'check':checkTask(id);return;
case 'hint':{let t=findTask(id);if(!t)return;S.hints[id]=Math.min(3,(S.hints[id]||0)+1);save();replaceTask(id);return}
case 'reveal':if(!(S.attempts[id]||S.teacher))return;S.reveals[id]=!S.reveals[id];save();replaceTask(id);return;
case 'selfmark':selfMark(id);return;
case 'paper-select':S.example.selected=+b.dataset.index;save();updateExample('cut');return;
case 'cut':{S.expDone=S.expDone||{};S.expDone.cut=true;let x=S.example.selected,cs=S.example.cut;if(cs.includes(x)){S.example.cutReport='Этот лист уже разрезан. Выбери другой целый лист.'}else if(cs.length<9){let before=9+cs.length*2,forecast=parseNum(S.example.cutPrediction);cs.push(x);let actual=before+2;S.example.cutReport=Number.isFinite(forecast)?`Прогноз: ${forecast}; получилось ${actual}. ${forecast===actual?'Совпало!':'Проверь прибавку +2.'}`:`Получилось ${actual}. Перед следующим шагом попробуй сделать прогноз.`;S.example.selected=Array.from({length:9},(_,i)=>i).find(i=>!cs.includes(i))??x}save();updateExample('cut');return}
case 'cutundo':S.example.cut.pop();S.example.cutReport='Последний шаг отменён.';save();updateExample('cut');return;
case 'cutreset':S.example.cut=[];S.example.selected=0;S.example.cutReport='Начали сначала: 9 листов.';save();updateExample('cut');return;
case 'work-back':case 'work-next':case 'work-reset':S.expDone=S.expDone||{};S.expDone.work=true;S.example.workDay=action==='work-reset'?0:Math.max(0,Math.min(10,(+S.example.workDay||0)+(action==='work-next'?1:-1)));save();updateExample('work');return;
case 'work-check':{let v=parseNum(S.example.workGuess);S.example.workOk=v===8;S.example.workReport=S.example.workOk?'Правильно: 8 дней второй бригады, вместе 1440 сосен.':'Подумай: фора 80 сосен, вторая нагоняет по 90 − 80 = 10 сосен в день.';save();updateExample('work');return}
case 'ice-check':{S.expDone=S.expDone||{};S.expDone.ice=true;let v=parseNum(S.example.iceGuess);S.example.iceOk=v===15;S.example.iceReport=S.example.iceOk?'Верно! 45 ропиков — цена трёх мороженых, значит, одного — 15.':'10 − 7 = 3 мороженых; на них потратили дополнительно 150 − 105 = 45 ропиков. Раздели 45 на 3.';S.example.iceUnlocked=!!S.example.iceOk||S.example.iceUnlocked;save();updateExample('ice');return}
case 'ice-back':case 'ice-next':case 'ice-reset':S.example.iceCount=action==='ice-reset'?7:Math.max(0,Math.min(17,(+S.example.iceCount||0)+(action==='ice-next'?1:-1)));save();updateExample('ice');return;
case 'packstep':{S.expDone=S.expDone||{};S.expDone.S8=true;initLab('S8');let k=b.dataset.pack,d=+b.dataset.delta,arr=['a','b','c'];let sum=arr.reduce((s,p)=>s+(S.labs.S8[p]||0),0);if(d>0&&sum>=9)return;S.labs.S8[k]=Math.max(0,(S.labs.S8[k]||0)+d);save();let output=document.querySelector('#lab_S8 [data-lab-output]');if(output)output.innerHTML=labOutput('S8');return}
case 'packreset':S.labs.S8={};save();let output=document.querySelector('#lab_S8 [data-lab-output]');if(output)output.innerHTML=labOutput('S8');return;
case 'print':document.body.classList.add('print-homework');document.getElementById('printHomework').setAttribute('aria-hidden','false');window.print();return;
case 'copyhw':{let s=DATA.homework.map(([n,q])=>n+'. '+q).join('\n\n');if(navigator.clipboard?.writeText){navigator.clipboard.writeText(s).then(()=>{b.textContent='Скопировано ✓'},()=>fallbackCopy(s))}else{fallbackCopy(s)}return}
}}
function fallbackCopy(s){const area=document.createElement('textarea');area.value=s;document.body.append(area);area.select();try{document.execCommand('copy');alert('Условия скопированы.')}catch(e){alert('Не удалось скопировать: выделите условия на странице.')}area.remove()}
document.addEventListener('click',e=>{const exp=e.target.closest('[data-exp]');if(exp){S.expCurrent=exp.dataset.exp;save();render();return}const go=e.target.closest('[data-go]');if(go){navigate(go.dataset.go);return}eventAction(e)});
document.addEventListener('input',e=>{let el=e.target;if(el.matches('[data-logmini]')){S.logMini=el.value;save();return}if(el.matches('[data-answer]')){let id=el.dataset.answer,k=el.dataset.key;S.answers[id]=S.answers[id]||{};S.answers[id][k]=el.type==='radio'?el.value:el.value;if(S.statuses[id]){delete S.statuses[id];let notice=document.querySelector('#task_'+id+' .feedback');if(notice){notice.className='feedback info';notice.textContent='Ответ изменён. Нажми «Проверить ответ» ещё раз.'}updateNav()}save()}else if(el.matches('[data-warm]')){S.warm[el.dataset.warm]={choice:+el.value};save()}else if(el.matches('[data-example-field]')){S.example[el.dataset.exampleField]=el.value;save()}else if(el.matches('[data-example-range]')){let k=el.dataset.exampleRange;S.example[k]=+el.value;save();let model=document.getElementById(k==='workDay'?'workModel':'iceModel');model.querySelector('.model-input output').textContent=el.value;if(k==='workDay'){let d=+el.value,a=80*(d+1),b=90*d,measures=model.querySelectorAll('.measure');measures[0].querySelector('strong').textContent=a;measures[1].querySelector('strong').textContent=b;measures[0].querySelector('.barfill').style.width=Math.min(100,a/900*100)+'%';measures[1].querySelector('.barfill').style.width=Math.min(100,b/900*100)+'%';model.querySelector('.live-notice').textContent=`Первая работала ${d+1} дн., вторая — ${d} дн. ${a>b?'Первая пока впереди на '+(a-b)+' сосен.':a===b?'Результаты равны!':'Вторая теперь впереди на '+(b-a)+' сосен.'}`;model.querySelector('[data-action=work-back]').disabled=d===0;model.querySelector('[data-action=work-next]').disabled=d===10}else{let q=+el.value;model.querySelector('.formula').textContent=`255 − ${q} · 15 = ${255-q*15} ропиков`;model.querySelector('.compact-line:last-child .live-notice').textContent=q===17?'Все 255 ропиков потрачены; 18-е мороженое уже не купить.':'Можно ли купить ещё? Сравни остаток с ценой 15 ропиков.';model.querySelector('[data-action=ice-back]').disabled=q===0;model.querySelector('[data-action=ice-next]').disabled=q===17}}else if(el.matches('[data-lab]')){let id=el.dataset.lab,k=el.dataset.labKey;initLab(id);S.expDone=S.expDone||{};S.expDone[id]=true;S.labs[id][k]=+el.value;save();let lab=document.getElementById('lab_'+id),v=lab.querySelector(`[data-lab-val="${k}"]`),output=lab.querySelector('[data-lab-output]');if(v)v.textContent=el.value;if(output)output.innerHTML=labOutput(id)}else if(el.matches('[data-rubric]')){let id=el.dataset.rubric,k='rubric'+el.dataset.index;S.answers[id]=S.answers[id]||{};S.answers[id][k]=el.checked;save()}});
// Native radio input changes are dispatched even when keyboard or label is used.
document.addEventListener('change',e=>{const el=e.target;if(el.matches('[data-filter]')){S.filters[el.dataset.filter]=el.value;S.filters.page=1;save();render();return}if(el.matches('[data-answer][type=radio]')){let id=el.dataset.answer;S.answers[id]=S.answers[id]||{};S.answers[id].selected=el.value;save()}else if(el.matches('[data-warm]')){S.warm[el.dataset.warm]={choice:+el.value};save()}});
window.addEventListener('hashchange',()=>{S.active=route();save();render()});window.addEventListener('afterprint',()=>{document.body.classList.remove('print-homework');document.getElementById('printHomework').setAttribute('aria-hidden','true')});
render();
</script>
</body>
