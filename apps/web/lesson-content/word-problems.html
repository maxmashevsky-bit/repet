/* Visual refresh matching the Repет reference: fixed rail, warm paper, tabbed lab */
:root{--shadow:0 10px 34px rgba(61,47,30,.033)}
body{background:#faf8f4;color:#302b27;line-height:1.6}
.sidebar{flex:0 0 270px;width:270px;padding:26px 16px 18px;gap:26px;background:#fefdfa;border-right:1px solid #e7e1d9}
.brand{font-size:0;letter-spacing:0;gap:11px;padding:0 5px 22px;border-bottom:1px solid #e8e1d8;align-items:center}
.brandmark-svg-wrap,.brandmark-svg{height:54px;width:54px;flex-basis:54px}
.brandmark-svg-wrap{border:1px solid #e9e0d5;border-radius:13px;background:white;padding:5px}
.brandmark-svg{width:100%;height:100%}
.brand-copy{display:flex;flex-direction:column;justify-content:center;gap:6px;white-space:nowrap}
.brand-copy strong{color:var(--text);font-size:28px;font-weight:850;line-height:1;letter-spacing:-.065em}
.brand-copy small{font-size:9px;color:#8a7b67;letter-spacing:.18em;line-height:1.2;font-weight:850}
.side-section{padding:0 0 0}
.sidecap{padding:0 14px;font-size:10px;letter-spacing:.19em;font-weight:850;margin-bottom:11px}
.nav{gap:7px}
.navbutton{position:relative;min-height:62px;padding:10px 11px;gap:10px;color:#5d554d;border-radius:13px;border:1px solid transparent;font-weight:780;font-size:13px;line-height:1.4;display:flex;align-items:center;text-align:left}
.navbutton:hover{background:#f4f3ee}
.navbutton.active{background:#eef3ed;border:1px solid #d1ded1;color:#305f49;outline:2px solid #d9a36f;outline-offset:3px}
.navbutton.active::before{content:"";position:absolute;left:-2px;top:12px;bottom:12px;width:4px;border-radius:5px;background:#d55f27}
.navicon{width:31px;height:31px;flex:0 0 31px;border:1px solid #e5dfd5;border-radius:8px;display:grid;place-items:center;color:#8c857a;background:#f8f6f1}
.navicon svg{width:19px;height:19px}
.navbutton.active .navicon{background:#fff;border-color:#d6e4d8;color:#397457}
.navlabel{flex:1;min-width:0}
.navbutton .count{background:#f8f6f1;border:1px solid #e8e1d8;color:#827970;border-radius:8px;padding:2px 7px;font-size:11px;line-height:1.3}
.navbutton.active .count{background:#fff;color:#3c7257;border-color:#d7e6d8}
.sidebar-bottom{border:none;padding:0;margin-top:auto;font-size:12px}
.side-progress-card{background:#f7f4ef;border:1px solid #e5ded4;padding:18px 16px 15px;border-radius:14px;color:#312b26}
.orange-dash{display:block;width:25px;height:3px;border-radius:5px;background:#d55f27;margin-bottom:12px}
.side-progress-card>strong{display:block;font-size:11px;letter-spacing:.075em}
.side-track{margin-top:12px;background:#deddd4;height:7px;border-radius:30px;overflow:hidden}
.side-track span{display:block;background:#40785a;width:0;height:100%;border-radius:inherit;transition:width .2s}
.side-progress-card p{font-size:12px;font-weight:740;margin:10px 0 4px;color:#817970}
.side-reset{font-size:12px;font-weight:700;color:#8e6b58;text-decoration:underline;background:transparent;padding:4px 0;border-radius:3px;text-align:left}
.workspace{background:#faf8f4}.topbar{position:sticky;top:0;background:rgba(250,248,244,.97);padding:13px clamp(24px,4.3vw,64px);height:54px}
.crumb-link{border:0;background:none;font-size:12px;color:#81786e;padding:4px 0}.crumb-link:hover{text-decoration:underline}
.content{max-width:1300px;padding:28px clamp(23px,4.2vw,63px) 90px}
h1{font-size:40px;letter-spacing:-.05em}h2{font-size:27px;letter-spacing:-.038em}h3{letter-spacing:-.03em}
.card{border-radius:16px;border-color:#e7e1d8;background:#fffdfa;box-shadow:0 4px 16px rgba(50,40,28,.025)}
.btn{border-radius:11px;min-height:43px;font-size:13px;font-weight:750}.btn.subtle{background:#fffdfa;border-color:#e0d9ce}
.exp-head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin:0 0 19px}
.exp-head h1{font-size:31px;margin:0 0 7px;font-weight:850;letter-spacing:-.053em}
.exp-head p{font-size:14px;color:#80766d;margin:0}
.exp-counter{white-space:nowrap;font-size:12px;font-weight:770;background:#fffdfa;padding:9px 13px;border:1px solid #e8e1d8;border-radius:100px;color:#84786c}
.experience-tabs{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:3px 3px 13px;margin-bottom:2px;scrollbar-width:thin;scrollbar-color:#d6cbbd transparent}
.exp-tab{background:#fffdfa;color:#6d655b;border:1px solid #e5ded4;border-radius:11px;padding:10px 14px;white-space:nowrap;font-size:12px;font-weight:790;min-height:43px;transition:background .15s;flex:0 0 auto}
.exp-tab:hover{background:#f1eee7}.exp-tab.active{background:#3f7659;color:#fff;border-color:#3f7659}
.experience-card{margin:0 0 17px;padding:26px 29px 21px;border-top:4px solid #3f7659;box-shadow:none}
.exp-topline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:0}
.exp-topline .eyebrow{font-size:11px;color:#cc5626;margin:0;letter-spacing:.12em}
.exp-done{padding:9px 14px;background:#fffdfa;color:#746f68;border:1px solid #e8e1d8;font-size:12px;font-weight:760;white-space:nowrap}
.exp-done.checked{color:#31644e;background:#edf3ed;border-color:#d6e4d6}
.experience-card>h2{font-size:28px;margin:0 0 10px;font-weight:850}
.exp-subtitle{font-size:15px;color:#81776d;margin:0 0 19px}
.exp-grid{display:grid;grid-template-columns:minmax(0,1.48fr) minmax(300px,.98fr);gap:16px}
.exp-model,.exp-aside{border:1px solid #e0e4dc;border-radius:13px;min-width:0;padding:22px 24px;background:#f3f6f0}
.exp-model{position:relative}.exp-model::before{content:"";position:absolute;left:0;top:0;width:34px;height:3px;background:#d55f27;border-radius:9px}
.exp-model>.lab{border:0;background:transparent;border-radius:0;padding:0;margin:0;box-shadow:none}
.exp-model .lab-title{font-size:18px;letter-spacing:-.03em;font-weight:850;color:#332d27;margin-bottom:10px}
.exp-model p{font-size:13px;color:#847a70;line-height:1.7}
.exp-model .model-input label{min-width:120px}.exp-model .paper-grid{grid-template-columns:repeat(9,minmax(0,1fr));gap:4px}.exp-model .paper{height:78px;padding:4px}
.exp-model .threecol{gap:8px}.exp-model .stat{background:#fffdfa;border:1px solid #e1e5dd;padding:13px;border-radius:11px}.exp-model .stat strong{color:#3f7659;font-size:24px}
.exp-model .formula{font-size:18px;white-space:normal;overflow-wrap:anywhere}
.exp-model .laboutput .num{font-size:24px}
.exp-aside{background:#fffdfa;border-color:#e7e0d7}
.exp-aside h3{font-size:16px;font-weight:850;margin:4px 0 17px}
.exp-aside p{font-size:13px;line-height:1.8;color:#756b62}
.exp-aside .exp-formula{background:#ebf2eb;color:#305f49;border:1px solid #d6e5d7;border-radius:11px;font-size:19px;font-weight:850;letter-spacing:-.035em;text-align:center;padding:18px 12px;margin:20px 0 16px;overflow-wrap:anywhere}
.exp-tip{border:1px solid #efd4bd;background:#fff3e9;border-radius:11px;padding:15px 16px;display:grid;gap:6px;color:#95572f;font-size:13px;line-height:1.6}
.exp-tip strong{font-weight:850}.exp-instruction{margin-top:16px}
.wood-board{display:flex;width:100%;height:80px;border-radius:12px;border:2px solid #9a6d48;overflow:hidden;margin:24px 0 17px;background:#d6a373;box-shadow:inset 0 2px 3px #fbdda2}
.wood-part{flex:1;display:flex;justify-content:center;align-items:center;color:#66472e;font-size:18px;font-weight:800;background:repeating-linear-gradient(-7deg,#dfb786 0px,#dfb786 8px,#d4a372 10px,#d4a372 14px,#e6bc89 16px,#dcb17b 24px);border-right:3px double #906440;min-width:0}
.wood-part:last-child{border-right:0}.wood-part span{font-variant-numeric:tabular-nums;overflow:hidden}.wood-note{font-size:11px;text-align:center;color:#8d755d;font-weight:740;margin:11px 0 16px}
.exp-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:16px 0}
.exp-stats div{display:flex;flex-direction:column;align-items:center;background:#fffdfa;border:1px solid #e0e4db;border-radius:11px;padding:11px 6px}
.exp-stats strong{font-size:27px;font-weight:850;color:#3f7659;line-height:1.3}.exp-stats span{font-size:10px;font-weight:800;letter-spacing:.07em;color:#877f73;text-align:center}
.exp-model-feedback{border:1px solid #dce6db;background:#fffdfa;color:#657064;padding:14px;border-radius:10px;margin-top:15px;font-size:13px}
.exp-model-feedback strong{color:#356d51}
.exp-check{border:1px solid #e8e1d8;border-left:4px solid #d55f27;border-radius:13px;background:#fffdfa;padding:23px 26px;margin:17px 0}
.exp-check>.eyebrow{margin-bottom:10px;color:#ca5725}.exp-check>.muted{font-size:13px}
.exp-check>.task-card{border:0;background:transparent;padding:0;box-shadow:none;margin:8px 0 0}
.exp-check .task-card .head{margin-bottom:10px}.exp-check .task-card h3{font-size:19px}
.exp-check .task-card .question{font-size:16px;font-weight:680}
.exp-follow{display:flex;justify-content:space-between;gap:10px;margin-top:24px;border-top:1px solid #e9e2d9;padding-top:20px}
.exp-links{display:flex;flex-wrap:wrap;gap:9px;margin:19px 0 0}
.exp-model .pack-nums{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:1130px){.sidebar{flex-basis:235px;width:235px;padding:20px 12px}.brand-copy strong{font-size:26px}.navbutton{padding:10px 8px}.content{padding-left:27px;padding-right:27px}.exp-grid{grid-template-columns:minmax(0,1fr) minmax(260px,.9fr)}.exp-model,.exp-aside{padding:18px}}
@media(max-width:920px){.exp-grid{grid-template-columns:1fr}.exp-model,.exp-aside{padding:20px}.experience-card{padding:23px}.exp-head h1{font-size:29px}.sidebar{flex-basis:200px;width:200px}.brandmark-svg-wrap{height:43px;width:43px;flex-basis:43px}.brand-copy strong{font-size:22px}.brand-copy small{font-size:7px}.navbutton{font-size:12px}.navicon{width:28px;height:28px;flex-basis:28px}}
@media(max-width:700px){.sidebar{width:100%;height:auto;position:relative;border-right:0;border-bottom:1px solid #e8e1d8;padding:12px 15px;display:block}.sidebar .brand{display:flex;border:0;padding:0}.brandmark-svg-wrap{height:38px;width:38px;flex-basis:38px}.brand-copy strong{font-size:22px}.brand-copy small{font-size:8px}.side-section,.sidebar-bottom{display:none}.mobile-quicknav{display:flex;position:sticky;top:53px;z-index:3}.topbar{height:53px;padding:11px 16px}.content{padding:25px 15px 75px}.exp-head{display:block;margin-bottom:16px}.exp-head h1{font-size:29px}.exp-head p{font-size:13px;margin-bottom:14px}.exp-counter{display:inline-block}.experience-tabs{margin-bottom:0}.exp-tab{font-size:12px;min-height:42px}.experience-card{padding:19px 16px}.experience-card>h2{font-size:23px}.exp-subtitle{font-size:14px}.exp-model,.exp-aside{padding:16px}.exp-model .paper-grid{grid-template-columns:repeat(5,minmax(0,1fr))}.exp-model .paper{height:60px}.exp-model .stat strong{font-size:19px}.exp-stats strong{font-size:23px}.exp-stats span{font-size:9px}.wood-board{height:65px}.wood-part{font-size:12px}.exp-aside .exp-formula{font-size:17px}.exp-topline .eyebrow{font-size:10px}.exp-done{padding:8px;font-size:11px}.exp-check{padding:19px 16px}.exp-follow .btn{font-size:11px;padding:10px;min-width:0}.exp-links .btn{flex:1}.topmeta{display:none}}
