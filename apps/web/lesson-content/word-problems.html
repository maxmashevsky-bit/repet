<script>
'use strict';
const DATA={"sources":[{"id":"S1","title":"Задача 1 · Кто сколько весит?","text":"Нюша, Крош и Ёжик решили взвеситься. К сожалению, ввиду их малой массы, весы работали только когда на них вставали сразу двое. Оказалось, что Нюша и Крош весят в сумме 30 кг, Нюша и Ёжик 35 кг, Крош и Ёжик — тоже 35 кг. Кто сколько весит?","hints":["Сравни суммы «Нюша + Ёжик» и «Крош + Ёжик». Что можно убрать с обеих сторон?","Нюша и Крош весят одинаково, а вместе 30 кг.","Каждый весит 30 : 2 = 15 кг, а Ёжик 35 − 15 = 20 кг."],"solution":"Нюша + Ёжик = Крош + Ёжик = 35 кг, поэтому Нюша = Крош. Каждый из них весит 30 : 2 = 15 кг. Ёжик: 35 − 15 = 20 кг. Ответ: 15 кг, 15 кг, 20 кг.","why":"Нельзя делить 35 на два: неизвестно, равны ли веса Ёжика и Нюши.","group":"","tag":"","fields":[{"key":"n","label":"Нюша, кг","ans":15},{"key":"k","label":"Крош, кг","ans":15},{"key":"e","label":"Ёжик, кг","ans":20}],"type":"number"},{"id":"S2","title":"Задача 2 · Подарок Крошу","text":"Нюша выбирает подарок Крошу, который будет состоять из тетрадки, ручек и блокнота. Ручка стоит в четыре раза дороже тетрадки, а блокнот — в четыре раза дороже ручки. Нюша купила тетрадку, две ручки и блокнот, потратив на все 200 ропиков. Сколько стоит каждый из купленных ей предметов?","hints":["Пусть тетрадка стоит одну одинаковую часть. Сколько таких частей стоит ручка?","Ручка — 4 части; блокнот — 16. В покупке 1 + 2·4 + 16 = 25 частей.","Одна часть: 200 : 25 = 8. Ручка: 8·4 = 32. Блокнот: 32·4 = 128."],"solution":"Переведём стоимость в «тетрадки»: 1 + 2 · 4 + 4 · 4 = 25. Одна тетрадка стоит 200 : 25 = 8 ропиков. Ручка — 8 · 4 = 32 ропика; блокнот — 32 · 4 = 128 ропиков. Проверка: 8 + 2 · 32 + 128 = 200.","why":"Блокнот в 4 раза дороже ручки, а не тетрадки: это 4 · 4 = 16 частей.","group":"","tag":"","fields":[{"key":"n","label":"Тетрадка, роп.","ans":8},{"key":"p","label":"Одна ручка, роп.","ans":32},{"key":"b","label":"Блокнот, роп.","ans":128}],"type":"number"},{"id":"S3","title":"Задача 3 · Дорога Совуньи","text":"Иногда Совунья добирается до своей работы на велосипеде, а иногда ходит пешком. Вчера Совунья до работы шла пешком, а обратно ехала на велосипеде, и потратила на дорогу суммарно 40 минут. Сегодня Совунья в обе стороны ехала на велосипеде, и потратила на всю дорогу всего 20 минут. Завтра Совунья собирается в обе стороны идти пешком. Сколько времени у нее займет путь при той же скорости?","hints":["Одинаковый путь на велосипеде в одну сторону занимает половину от 20 минут.","Велосипед в одну сторону: 10 минут. Значит, пешком в одну сторону: 40 − 10 = 30 минут.","В обе стороны пешком: 30 · 2 = 60 минут."],"solution":"Велосипед в одну сторону: 20 : 2 = 10 минут. Пешком в одну сторону: 40 − 10 = 30 минут. Два пеших пути: 30 · 2 = 60 минут = 1 час.","why":"40 минут — это не время одной прогулки пешком: вчера было два разных способа движения.","group":"","tag":"","fields":[{"key":"t","label":"В обе стороны пешком, мин","ans":60}],"type":"number"},{"id":"S4","title":"Задача 4 · Побелка потолков","text":"Нюша и Крош решили переехать в более просторные дома. Нюша выбрала прямоугольный дом, длина которой составляет 5 метров, а ширина — 4 метра. Крош выбрал прямоугольный дом такой же ширины, но на 2 метра длиннее, чем Нюша. После переезда оба первым делом решили побелить потолок, и заказали услуги у одной и той же фирмы. При этом Крош потратил на 800 ропиков больше, чем Нюша. Сколько они заплатили за побелку потолков вместе?","hints":["Нарисуй два прямоугольника 5×4 и 7×4. Найди разницу их площадей.","Площади 20 и 28 м², разница 8 м². Цена 1 м²: 800 : 8 = 100 ропиков.","Общая площадь 20 + 28 = 48 м². Стоимость: 48 · 100 = 4800 ропиков."],"solution":"Потолок Нюши: 5 · 4 = 20 м². Потолок Кроша: (5 + 2) · 4 = 28 м². Разница: 8 м². Один квадратный метр стоит 800 : 8 = 100 ропиков. Всего: (20 + 28) · 100 = 4800 ропиков.","why":"800 ропиков — разница платежей, а не цена одного квадратного метра.","group":"","tag":"","fields":[{"key":"m","label":"Всего, роп.","ans":4800}],"type":"number"},{"id":"S5","title":"Задача 5 · Конфеты и ответы","text":"Нюша решила проверить эрудированность Кроша. А чтобы было веселее, за каждый правильно данный ответ Крош получал по 4 конфеты, а за каждый неправильный Нюша забирала у Кроша 6 конфет. Всего Нюша задала 20 вопросов, в начале у Кроша было 100 конфет, а в конце — 120. На сколько вопросов Крош ответил правильно?","hints":["Представь, что все 20 ответов правильные. Сколько конфет стало бы?","Было бы 100 + 20 · 4 = 180. Получилось 120, разница 60. Каждая ошибка уменьшает этот максимум на 4 + 6 = 10.","Ошибок 60 : 10 = 6. Верных ответов 20 − 6 = 14."],"solution":"Если все 20 ответов правильные, станет 100 + 20 · 4 = 180 конфет. На самом деле 120, то есть на 60 меньше. Одна ошибка вместо правильного ответа «стоит» 4 + 6 = 10 конфет. Ошибок 60 : 10 = 6; правильных 20 − 6 = 14. Проверка: 100 + 14 · 4 − 6 · 6 = 120.","why":"За ошибку отличие от правильного ответа равно 10, а не 6: теряем возможные +4 и получаем −6.","group":"","tag":"","fields":[{"key":"q","label":"Правильных ответов","ans":14}],"type":"number"},{"id":"S6","title":"Задача 6 · Пончики на троих","text":"Нюша и Крош решили пообедать пончиками. У Нюши было 250 ропиков, а у Кроша — 350 ропиков. На все деньги они купили пончики. Тут к ним подошел Бараш, попросив разделить с ним трапезу. Все пончики были поделены поровну и немедленно съедены. Не желая остаться в долгу, Бараш хочет заплатить за съеденные им пончики. Сколько ропиков он должен отдать Нюше и сколько Крошу, чтобы в итоге все заплатили за пончики одинаково?","hints":["Найди общую стоимость пончиков и раздели её на троих.","Всего 250 + 350 = 600. Справедливая доля: 600 : 3 = 200 ропиков.","Нюша переплатила 250 − 200 = 50, Крош переплатил 350 − 200 = 150 ропиков."],"solution":"Трапеза стоит 250 + 350 = 600 ропиков. Доля каждого: 600 : 3 = 200 ропиков. Бараш компенсирует Нюше 250 − 200 = 50 ропиков, Крошу 350 − 200 = 150 ропиков. После возврата каждый потратил 200.","why":"Не нужно делить 200 ропиков Бараша пополам: сначала смотрим, кто сколько уже переплатил.","group":"","tag":"","fields":[{"key":"n","label":"Отдать Нюше, роп.","ans":50},{"key":"k","label":"Отдать Крошу, роп.","ans":150}],"type":"number"},{"id":"S7","title":"Задача 7 · Путешествие Пина","text":"Пин отправился к своим друзьям в деревню неподалеку от города. Туда он весь путь шел пешком. В гостях его хорошо накормили и развлекали, и Пин сильно устал. Поэтому первую половину обратного пути он шел в два раза медленнее, чем по пути в деревню. На середине пути он совсем выдохся и сел на попутную машину, которая ехала со скоростью в 5 раз большей, чем Пин шел в деревню. На какой путь Пин потратил больше времени: в деревню или обратно?","hints":["Сравни время на весь путь туда и только на первую половину обратного пути.","На половину дороги со скоростью вдвое меньше требуется ровно столько же времени, сколько на всю дорогу туда.","После этого Пин ещё едет на машине некоторое положительное время: обратно дольше."],"solution":"Обозначим время пути туда за T. Половина обратного пути при скорости в 2 раза меньше занимает (1/2) · 2T = T. Вторая половина на машине со скоростью в 5 раз больше занимает T/10. Обратно: T + T/10 = 1,1T > T.","why":"Нельзя усреднять скорости 1/2 и 5: расстояния равны, а время обратно вычисляется по частям.","group":"","tag":"","type":"choice","choices":[{"v":"there","t":"В деревню"},{"v":"back","t":"Обратно"},{"v":"equal","t":"Одинаково"}],"answer":"back"},{"id":"S8","title":"Задача 8 · Упаковки карандашей","text":"Лосяш хочет купить 153 карандаша: 3 для себя, остальные 150 для нужд лосиной академии. К сожалению, в магазине карандаши продаются не по одному, а только упаковками по 19, 20 и 21 штуке. Сколько упаковок каждого вида нужно купить Лосяшу? Укажите все варианты и докажите, что других нет.","hints":["Докажи, что упаковок ровно восемь: семь даже по 21 дают мало, девять даже по 19 — много.","Восемь упаковок по 19 содержали бы 152 карандаша. Не хватает ровно одного.","Только одна упаковка может быть по 20; остальные семь по 19. Любая упаковка по 21 добавила бы сразу два карандаша."],"solution":"7 · 21 = 147 < 153, а 9 · 19 = 171 > 153, значит, упаковок ровно 8. Базовое количество: 8 · 19 = 152. Нужно добавить ровно 1 карандаш. Упаковка 20 вместо 19 добавляет 1; упаковка 21 вместо 19 добавляет 2. Поэтому единственный вариант: 7 упаковок по 19, 1 упаковка по 20, 0 по 21. Проверка: 7 · 19 + 20 = 153.","why":"Одного подходящего набора мало: «все варианты» требует доказать невозможность остальных.","group":"","tag":"","fields":[{"key":"a","label":"Упаковок по 19","ans":7},{"key":"b","label":"Упаковок по 20","ans":1},{"key":"c","label":"Упаковок по 21","ans":0}],"type":"number"}],"practice":[{"id":"P01","title":"Разрезаем бумагу","text":"Было 7 листов. Четыре листа разрезали каждый на 4 части. Сколько кусочков бумаги стало?","hints":["Один разрезанный лист заменяют четыре кусочка.","Прибавка за лист: 4 − 1 = 3.","7 + 4 · 3 = 19."],"solution":"7 + 4 · (4 − 1) = 19.","why":"Не прибавляй все четыре части: один целый лист был и до разрезания.","group":"1","tag":"","fields":[{"key":"x","label":"Кусочков","ans":19}],"type":"number","difficulty":"Лёгкий","topic":"Листы и изменение"},{"id":"P02","title":"Узнай количество разрезов","text":"Из 6 листов сделали 14 кусочков. Каждый выбранный лист разрезали на 3 части. Сколько листов разрезали?","hints":["Найди, на сколько увеличилось число бумажек.","14 − 6 = 8. Один разрезанный лист даёт +2.","8 : 2 = 4."],"solution":"(14 − 6) : (3 − 1) = 4.","why":"Не путай количество кусочков с количеством разрезанных исходных листов.","group":"1","tag":"","fields":[{"key":"x","label":"Разрезали листов","ans":4}],"type":"number","difficulty":"Лёгкий","topic":"Работа"},{"id":"P03","title":"Цена покупок","text":"Тетрадка стоит 6 ропиков. Ручка в 3 раза дороже тетрадки, блокнот в 2 раза дороже ручки. Сколько стоит блокнот?","hints":["Сначала найди цену ручки.","Ручка стоит 6 · 3 = 18.","Блокнот стоит 18 · 2 = 36."],"solution":"6 · 3 · 2 = 36.","why":"Два отношения нужно применить последовательно.","group":"1","tag":"","fields":[{"key":"x","label":"Блокнот, роп.","ans":36}],"type":"number","difficulty":"Лёгкий","topic":"Покупки"},{"id":"P04","title":"Трое на весах","text":"Аня с Борей весят 26 кг, Аня с Витей — 31 кг, Боря с Витей — 31 кг. Найди массу каждого.","hints":["Сравни две одинаковые суммы по 31 кг.","Аня = Боря. Вместе они весят 26 кг.","Каждый по 13 кг, Витя — 31 − 13 = 18 кг."],"solution":"13, 13, 18 кг.","why":"Одинаковые суммы с одним общим слагаемым дают равенство других слагаемых.","group":"1","tag":"","fields":[{"key":"a","label":"Аня, кг","ans":13},{"key":"b","label":"Боря, кг","ans":13},{"key":"c","label":"Витя, кг","ans":18}],"type":"number","difficulty":"Лёгкий","topic":"Массы и сравнение"},{"id":"P05","title":"Пешком и на велосипеде","text":"Два велосипедных пути занимают 24 минуты. Пешком туда и на велосипеде назад — 42 минуты. Сколько минут займут два пеших пути?","hints":["Найди продолжительность одной велосипедной поездки.","24 : 2 = 12; один пеший путь занимает 42 − 12 = 30.","30 · 2 = 60."],"solution":"60 минут.","why":"Не удваивай 42: это уже сочетание двух разных способов.","group":"1","tag":"","fields":[{"key":"x","label":"Минут","ans":60}],"type":"number","difficulty":"Лёгкий","topic":"Листы и изменение"},{"id":"P06","title":"Догоняющие бригады","text":"Первая бригада делает 50 деталей в день, вторая — 60. Вторая вышла на работу на день позже, но сделала столько же деталей. Сколько деталей сделали вместе?","hints":["За первый день первая бригада получает фору 50 деталей.","Вторая наверстывает по 60 − 50 = 10 деталей в день, значит, ей нужно 5 дней.","Каждая изготовила 60 · 5 = 300 деталей. Вместе 600."],"solution":"50 : (60 − 50) = 5 дней; 5 · 60 · 2 = 600 деталей.","why":"5 дней — работа второй бригады, первая работала 6 дней.","group":"2","tag":"","fields":[{"key":"x","label":"Всего деталей","ans":600}],"type":"number","difficulty":"Средний","topic":"Работа"},{"id":"P07","title":"Бригады, два дня форы","text":"Первая бригада делает 72 детали за день, вторая — 84. Вторая начала работу на два дня позже, но сделала столько же. Сколько деталей сделали вместе?","hints":["У первой фора за два дня: 72 · 2.","Каждый общий день вторая сокращает отставание на 84 − 72 = 12 деталей.","Общих дней 144 : 12 = 12. Обе сделали по 84 · 12 = 1008."],"solution":"2 · 72 = 144; 144 : 12 = 12; 2 · (12 · 84) = 2016.","why":"Если фора два дня, умножь дневной результат первой на два.","group":"2","tag":"","fields":[{"key":"x","label":"Всего деталей","ans":2016}],"type":"number","difficulty":"Средний","topic":"Покупки"},{"id":"P08","title":"Две крыши","text":"Первая крыша 6 × 4 м, вторая 8 × 4 м. За вторую покраску заплатили на 640 ропиков больше. Сколько заплатили вместе при одной цене за квадратный метр?","hints":["Разница площадей: (8 − 6) · 4.","Разница 8 м²; 1 м² стоит 640 : 8 = 80.","Общая площадь 24 + 32 = 56 м²."],"solution":"(6 · 4 + 8 · 4) · (640 : 8) = 4480.","why":"Сначала найди цену одной и той же единицы площади.","group":"2","tag":"","fields":[{"key":"x","label":"Всего, роп.","ans":4480}],"type":"number","difficulty":"Средний","topic":"Движение"},{"id":"P09","title":"Школьная викторина","text":"За правильный ответ дают 3 конфеты, за ошибку забирают 2. Было 12 вопросов, сначала 40 конфет, в конце 56. Сколько ответов правильные?","hints":["При 12 верных ответах стало бы 40 + 12 · 3.","Максимум 76, разница с фактом 20. Одна ошибка «стоит» 3 + 2 = 5.","Ошибок 20 : 5 = 4, верных 12 − 4 = 8."],"solution":"8 верных и 4 ошибки: 40 + 8 · 3 − 4 · 2 = 56.","why":"Каждая ошибка стоит сразу двух изменений: нет +3, есть −2.","group":"2","tag":"","fields":[{"key":"x","label":"Правильных ответов","ans":8}],"type":"number","difficulty":"Средний","topic":"Площадь"},{"id":"P10","title":"Поровну за обед","text":"Маша заплатила за общий обед 180 ропиков, Саша — 300, третий друг пока не платил. Все трое съели поровну. Сколько третий должен вернуть Маше и Саше?","hints":["Поделите общий чек на троих.","Чек 480; доля каждого 160.","Маша внесла лишние 20, Саша — лишние 140."],"solution":"180 − 160 = 20; 300 − 160 = 140.","why":"Нельзя делить сумму возврата просто поровну.","group":"2","tag":"","fields":[{"key":"m","label":"Маше, роп.","ans":20},{"key":"s","label":"Саше, роп.","ans":140}],"type":"number","difficulty":"Средний","topic":"Логика и конфеты"},{"id":"P11","title":"Сколько наборов?","text":"Нужно купить ровно 82 карандаша в упаковках по 9, 10 и 11 штук. Сколько различных наборов упаковок существует, если порядок покупки не важен?","hints":["Определи возможное число упаковок: 7·11 = 77 < 82, а 10·9 = 90 > 82.","При восьми упаковках от 8·9 = 72 нужно добавить 10: b + 2c = 10. При девяти упаковках от 9·9 = 81 добавить 1.","Для 8 упаковок: c = 2,3,4,5, всего 4 набора; для 9 упаковок: одна десятка и восемь девяток, ещё 1 набор."],"solution":"Всего 5 наборов. 8 упаковок: (по 9, по 10, по 11) = (0,6,2), (1,4,3), (2,2,4), (3,0,5). 9 упаковок: (8,1,0).","why":"Сначала проверь обе возможные численности упаковок: 8 и 9.","group":"3","tag":"","fields":[{"key":"x","label":"Вариантов","ans":5}],"type":"number","difficulty":"Средний","topic":"Перебор наборов"},{"id":"P12","title":"Какая часть времени?","text":"Путник шёл всю дорогу туда со скоростью v. Обратно половину расстояния он шёл в 2 раза медленнее, а остальную половину ехал в 4 раза быстрее. Во сколько раз путь обратно дольше пути туда?","hints":["Возьми время дороги туда за одну единицу.","Первая половина обратно: (1/2)·2 = 1 времени туда; вторая: (1/2):4 = 1/8.","Итого 1 + 1/8 = 9/8."],"solution":"Время обратно составляет 9/8 времени туда, то есть в 1,125 раза больше.","why":"Складывают времена на частях пути, а не скорости.","group":"3","tag":"","fields":[{"key":"x","label":"Во сколько раз (можно дробью)","ans":1.125}],"type":"number","difficulty":"Средний","topic":"Равные доли"},{"id":"P13","title":"Мороженое и сдача","text":"После покупки 4 мороженых осталось 94 ропика, после покупки 8 таких же — 46 ропиков. Сколько стоит одно мороженое и сколько их максимально можно купить?","hints":["Четыре добавочных мороженых уменьшают сдачу на 94 − 46.","Цена 48 : 4 = 12; весь кошелёк 4 · 12 + 94 = 142.","142 : 12 = 11 целых, останется 10 ропиков."],"solution":"Цена 12, деньги 142, максимум 11 мороженых.","why":"Максимальное целое количество — без округления вверх.","group":"3","tag":"","fields":[{"key":"p","label":"Цена одного, роп.","ans":12},{"key":"n","label":"Максимум, штук","ans":11}],"type":"number","difficulty":"Средний","topic":"Массы и сравнение"},{"id":"P14","title":"Покупки Ёжика","text":"После 3 мороженых осталось 87 ропиков, после 6 мороженых — 60. Сколько мороженых можно максимально купить?","hints":["Три дополнительных мороженых уменьшили сдачу на 27.","Одно мороженое стоит 27 : 3 = 9.","Всего 3 · 9 + 87 = 114; 114 : 9 = 12 целых."],"solution":"12 мороженых, останется 6 ропиков.","why":"Проверь, хватит ли на тринадцатое.","group":"3","tag":"","fields":[{"key":"x","label":"Штук","ans":12}],"type":"number","difficulty":"Средний","topic":"Логика и конфеты"},{"id":"P15","title":"Выбери следующий логический шаг","text":"Даны суммы Аня + Боря = 24 кг, Аня + Витя = 29 кг и Боря + Витя = 29 кг. Что следует из двух последних равенств?","hints":["В обеих суммах есть один и тот же Витя.","Убери массу Вити из обеих одинаковых сумм.","Остаётся Аня = Боря."],"solution":"Аня + Витя = Боря + Витя, значит, Аня = Боря. Это не говорит, что Витя весит столько же.","why":"Общим человеком в одинаковых суммах является Витя.","group":"3","tag":"","type":"choice","choices":[{"v":"ab","t":"Аня и Боря весят одинаково"},{"v":"av","t":"Аня и Витя весят одинаково"},{"v":"all","t":"Все трое весят одинаково"}],"answer":"ab","difficulty":"Средний","topic":"Движение"},{"id":"P16","title":"Найди ошибку в объяснении","text":"Первая бригада делает 40 деталей в день, вторая — 50 и начала на день позже. Ученик вычислил 40 : (50 − 40) = 4. Что именно означает число 4?","hints":["40 — первоначальная фора первой бригады.","Разница дневной работы равна 10 деталям.","За четыре дня работы вторая догоняет первую; первая работала пять дней."],"solution":"4 — дни работы второй бригады. Первая работала 5 дней, а обе сделали по 200 деталей.","why":"Фора получена до выхода второй бригады; равенство наступает через 4 дня именно её работы.","group":"4","tag":"","type":"choice","choices":[{"v":"all","t":"Дней работы первой бригады"},{"v":"second","t":"Дней работы второй бригады"},{"v":"total","t":"Общее количество деталей"}],"answer":"second","difficulty":"Сложный","topic":"Работа"},{"id":"P17","title":"Части большого листа","text":"Из 12 листов некоторые разрезали на 5 частей, и стало 36 кусочков бумаги. Сколько листов разрезали?","hints":["Найди прирост 36 − 12.","Каждый разрезанный лист увеличивает число кусочков на 5 − 1 = 4.","24 : 4 = 6."],"solution":"(36 − 12) : 4 = 6 листов.","why":"Одно целое превратилось в 5, прирост — именно 4.","group":"4","tag":"","fields":[{"key":"x","label":"Листов","ans":6}],"type":"number","difficulty":"Сложный","topic":"Листы и изменение"},{"id":"P18","title":"Восстанови ценники","text":"Четыре тетрадки, две ручки и один альбом стоят 280 ропиков. Ручка в 2 раза дороже тетрадки, альбом в 3 раза дороже ручки. Найди цену каждого предмета.","hints":["Измерь всё «тетрадками»: ручка 2 части, альбом 6 частей.","Всего 4 + 2 · 2 + 6 = 14 частей.","280 : 14 = 20; ручка 40; альбом 120."],"solution":"20, 40, 120. Проверка: 4·20 + 2·40 + 120 = 280.","why":"В покупке четыре тетрадки и две ручки — учитывай оба количества.","group":"4","tag":"","fields":[{"key":"n","label":"Тетрадка, роп.","ans":20},{"key":"p","label":"Ручка, роп.","ans":40},{"key":"a","label":"Альбом, роп.","ans":120}],"type":"number","difficulty":"Сложный","topic":"Покупки"},{"id":"P19","title":"Кто сколько вернёт?","text":"Два друга оплатили пончики: один 240 ропиков, второй 360. Появился третий, все съели поровну. Сколько третий вернёт каждому?","hints":["Найди долю одного едока.","(240 + 360) : 3 = 200.","Первый переплатил 40; второй 160."],"solution":"240 − 200 = 40; 360 − 200 = 160.","why":"Компенсируются переплаты, а не исходные расходы.","group":"4","tag":"","fields":[{"key":"a","label":"Первому, роп.","ans":40},{"key":"b","label":"Второму, роп.","ans":160}],"type":"number","difficulty":"Сложный","topic":"Равные доли"},{"id":"P20","title":"Объясни, почему других вариантов нет","text":"Лосяш берёт ровно 153 карандаша упаковками по 19, 20, 21. Напиши два довода: почему упаковок ровно 8 и почему набор из 7 упаковок по 19 и 1 по 20 — единственный.","hints":["Начни с двух границ: самое много за 7 упаковок и самое мало за 9.","Когда установишь 8, сравни 153 с 8 · 19.","Разница равна 1. Упаковка по 21 вместо 19 добавит 2 — это уже лишнее."],"solution":"Семь упаковок дают не более 7·21 = 147 < 153. Девять упаковок дают не менее 9·19 = 171 > 153. Следовательно, ровно восемь. Если все по 19, было бы 8·19 = 152; нужно ровно +1. Заменить одну 19 на 20 можно, а заменить на 21 нельзя (+2). Значит, только 7×19 и 1×20.","why":"Проверка одного подходящего набора не доказывает единственность.","group":"4","tag":"","type":"reason","rubric":["Указал: 7 · 21 = 147 < 153, значит, семи упаковок мало.","Указал: 9 · 19 = 171 > 153, значит, девять упаковок — слишком много.","Получил 8 · 19 = 152 и недостающий 1 карандаш.","Объяснил: 20 добавляет 1, а 21 добавляет 2, поэтому возможна только одна двадцатка."],"difficulty":"Сложный","topic":"Перебор наборов"},{"id":"X001","title":"Прибавка от одного действия","text":"Один лист бумаги разделили на 6 равных кусочков. На сколько изменилось общее количество кусочков?","hints":["До разрезания этот лист уже считался одним.","Теперь вместо одного стало шесть.","Вычти 1 из 6."],"solution":"6 − 1 = 5 дополнительных кусочков.","why":"6 — новое число частей, но прибавка равна пяти.","group":"1","topic":"Листы и изменение","difficulty":"Лёгкий","kind":"number","fields":[{"key":"x","label":"Ответ","ans":5}],"type":"number"},{"id":"X002","title":"Сколько целых листов осталось?","text":"В коробке было 15 листов. Пять из них разделили на 4 части. Сколько первоначальных листов осталось целыми?","hints":["Здесь спрашивают не количество всех кусочков.","Каждый разрезанный лист перестаёт быть целым.","15 − 5."],"solution":"15 − 5 = 10 целых листов.","why":"Не путай целые листы с получившимися кусочками.","group":"1","topic":"Листы и изменение","difficulty":"Лёгкий","kind":"number","fields":[{"key":"x","label":"Ответ","ans":10}],"type":"number"},{"id":"X003","title":"Восстанови число листов","text":"Четыре листа разделили каждый на 3 части. Теперь на столе 20 кусочков. Сколько листов было сначала?","hints":["У четырёх разрезанных листов прибавка одинаковая.","Прибавка = 4 × (3 − 1) = 8.","Начало = конец − прибавка."],"solution":"20 − 4 · 2 = 12 листов.","why":"Нельзя вычесть 4 · 3: до разрезания четыре листа уже были.","group":"2","topic":"Листы и изменение","difficulty":"Средний","kind":"number","fields":[{"key":"x","label":"Ответ","ans":12}],"type":"number"},{"id":"X004","title":"Две разные операции","text":"Из 10 листов два разделили на 3 части, а три других — на 5 частей. Сколько кусочков получилось?","hints":["У разных типов разрезания разные прибавки.","Две тройки добавляют 2·2; три пятёрки добавляют 3·4.","10 + 4 + 12."],"solution":"10 + 2 · 2 + 3 · 4 = 26 кусочков.","why":"Разрезаем разные исходные листы, иначе двойной счёт.","group":"2","topic":"Листы и изменение","difficulty":"Средний","kind":"number","fields":[{"key":"x","label":"Ответ","ans":26}],"type":"number"},{"id":"X005","title":"Найди ошибочный шаг","text":"Миша записал: «Разрезали 3 листа на 4 части. Значит, кусочков стало на 3 · 4 = 12 больше». Что он забыл?","hints":["Сравни количество до и после разрезания именно этих листов.","Было три исходных листа, стало двенадцать кусочков.","Прибавка равна 12 − 3."],"solution":"Прибавка 3 · (4 − 1) = 9, а 12 — число кусочков из выбранных листов.","why":"Важно считать изменение, а не новое количество.","group":"2","topic":"Листы и изменение","difficulty":"Средний","kind":"choice","type":"choice","choices":[{"v":"0","t":"Учесть цену бумаги"},{"v":"1","t":"Вычесть три исходных листа"},{"v":"2","t":"Разделить ответ на четыре"}],"answer":"1"},{"id":"X006","title":"Проверь возможность","text":"Из 8 листов после разрезания некоторых на 4 части получилось 22 кусочка. Возможно ли это?","hints":["Прирост должен делиться на три.","22 − 8 = 14.","14 не кратно 3."],"solution":"Нет. Каждое разрезание увеличивает число на 3, а прирост 14 таким быть не может.","why":"Недостаточно, чтобы ответ был целым количеством кусочков.","group":"3","topic":"Листы и изменение","difficulty":"Сложный","kind":"choice","type":"choice","choices":[{"v":"0","t":"Да, если разрезать 4 листа"},{"v":"1","t":"Нет, потому что 14 не делится на 3"},{"v":"2","t":"Да, если разрезать 5 листов"}],"answer":"1"},{"id":"X007","title":"Сколько операций двух видов?","text":"Изначально 10 листов. Два разрезали на три части, ещё несколько — на четыре. Всего получилось 29 кусочков. Сколько листов разрезали на четыре части?","hints":["Первые два листа увеличивают число кусочков на четыре.","Оставшийся прирост = 29 − 10 − 4 = 15.","Разрезание на 4 даёт прибавку +3."],"solution":"15 : 3 = 5 листов; всего выбраны семь различных листов из десяти.","why":"Не забывай учесть первые два разрезания.","group":"3","topic":"Листы и изменение","difficulty":"Сложный","kind":"number","fields":[{"key":"x","label":"Ответ","ans":5}],"type":"number"},{"id":"X008","title":"Объясни невозможность","text":"Было 7 листов. Каждый разрезанный лист превращается строго в 3 кусочка. Может ли получиться ровно 16 кусочков? Запиши рассуждение.","hints":["Сколько кусочков нужно дополнительно?","Изменение всегда кратно двум.","16 − 7 = 9 — нечётное число."],"solution":"Нет: 16 − 7 = 9, каждый лист добавляет 2, сумма двоек не может равняться девяти.","why":"Для доказательства нужна закономерность, а не несколько примеров.","group":"3","topic":"Листы и изменение","difficulty":"Сложный","kind":"reason","type":"reason","rubric":["Найдена прибавка 16 − 7 = 9.","Указано, что каждый разрезанный лист добавляет 2.","Объяснено, почему сумма двоек не может равняться 9."]},{"id":"X009","title":"Работа за несколько дней","text":"Бригада делает 24 детали за день. Сколько деталей изготовит за 6 одинаковых рабочих дней?","hints":["В один день — 24 детали.","Одинаковый темп за шесть дней.","24 · 6."],"solution":"24 · 6 = 144 детали.","why":"Не складывай количество дней и деталей.","group":"1","topic":"Работа","difficulty":"Лёгкий","kind":"number","fields":[{"key":"x","label":"Ответ","ans":144}],"type":"number"},{"id":"X010","title":"Найди число дней","text":"Рабочие собрали 168 деталей со скоростью 28 деталей в день. Сколько дней они работали?","hints":["Работа = скорость · время.","Время = работа : скорость.","168 : 28."],"solution":"168 : 28 = 6 дней.","why":"Объясни единицы результата: дни, а не детали.","group":"1","topic":"Работа","difficulty":"Лёгкий","kind":"number","fields":[{"key":"x","label":"Ответ","ans":6}],"type":"number"},{"id":"X011","title":"Одна бригада догоняет другую","text":"Первая команда делает 30 деталей в день. Вторая делает 35, но выходит на день позже. Через сколько дней работы второй бригады их результаты сравняются?","hints":["Первая получает фору за один день.","Фора 30 изделий, за день вторая догоняет на 5.","30 : 5."],"solution":"Вторая догоняет за 30 : (35 − 30) = 6 дней.","why":"Не считай шесть дней для первой: у неё семь.","group":"2","topic":"Работа","difficulty":"Средний","kind":"number","fields":[{"key":"x","label":"Ответ","ans":6}],"type":"number"},{"id":"X012","title":"Чья выработка больше?","text":"Один мастер делает 18 изделий за час и работает 5 часов. Другой делает 15 изделий за час и работает 6 часов. Сравни результаты.","hints":["Перемножь темп и время каждого.","18·5 = 90; 15·6 = 90.","Выработка одинакова."],"solution":"Оба изготовили 90 изделий.","why":"Более высокая скорость не гарантирует больше работы при меньшем времени.","group":"2","topic":"Работа","difficulty":"Средний","kind":"choice","type":"choice","choices":[{"v":"0","t":"Первый изготовил больше"},{"v":"1","t":"Второй изготовил больше"},{"v":"2","t":"Они изготовили поровну"}],"answer":"2"},{"id":"X013","title":"Два вида результата","text":"Первая мастерская делает 40 деталей в день, вторая — 55. Обе работали четыре дня. На сколько деталей больше сделала вторая?","hints":["За день разница 15.","Четыре дня с постоянной разницей.","(55 − 40) · 4."],"solution":"За 4 дня разница (55 − 40)·4 = 60 деталей.","why":"Не путай 60 с общим количеством деталей.","group":"2","topic":"Работа","difficulty":"Средний","kind":"number","fields":[{"key":"x","label":"Ответ","ans":60}],"type":"number"},{"id":"X014","title":"Работа при смене скорости","text":"Мастер два дня делал по 12 фигурок, следующие три дня — по 16. Сколько фигурок он сделал за все пять дней?","hints":["Раздели работу на два периода.","За два дня 24, за три дня 48.","24 + 48."],"solution":"2·12 + 3·16 = 72 фигурки.","why":"Нельзя умножить одну из скоростей сразу на пять дней.","group":"3","topic":"Работа","difficulty":"Сложный","kind":"number","fields":[{"key":"x","label":"Ответ","ans":72}],"type":"number"},{"id":"X015","title":"Проверь неверный расчёт","text":"Два работника делают за день 20 и 30 деталей соответственно. Лена утверждает, что за 4 дня они вместе выполнят 20 + 30 · 4 = 140 деталей. Где ошибка?","hints":["Оба работают четыре дня.","Скобки помогают умножить общую дневную выработку.","(20 + 30) · 4 = 200."],"solution":"За четыре дня совместно (20 + 30)·4 = 200 деталей; первое слагаемое тоже умножается на 4.","why":"Приведённый ответ учитывает всего один день первого мастера.","group":"3","topic":"Работа","difficulty":"Сложный","kind":"choice","type":"choice","choices":[{"v":"0","t":"Нужно умножить обе дневные выработки на 4"},{"v":"1","t":"Нужно делить на 4"},{"v":"2","t":"Оба расчёта верны"}],"answer":"1"},{"id":"X016","title":"Работа с неизвестной скоростью","text":"За пять дней первая бригада изготовила 150 изделий. Вторая изготовила те же 150 изделий за три дня. На сколько изделий в день вторая быстрее?","hints":["Найди скорости обеих бригад.","Первая: 150 : 5 = 30; вторая: 150 : 3 = 50.","Разница скоростей 50 − 30."],"solution":"150 : 3 − 150 : 5 = 50 − 30 = 20 изделий в день.","why":"Сравнивай производительность в одинаковых единицах — изделий за день.","group":"3","topic":"Работа","difficulty":"Сложный","kind":"number","fields":[{"key":"x","label":"Изделий за день больше","ans":20}],"type":"number"},{"id":"X017","title":"Во сколько раз дороже?","text":"Тетрадка стоит 9 ропиков, а ручка — в 3 раза дороже. Сколько стоят тетрадка и ручка вместе?","hints":["Ручка — это три цены тетрадки.","Ручка стоит 9 · 3 = 27.","Теперь прибавь 9."],"solution":"9 + 27 = 36 ропиков.","why":"Цена ручки не равна 9 + 3.","group":"1","topic":"Покупки","difficulty":"Лёгкий","kind":"number","fields":[{"key":"x","label":"Ответ","ans":36}],"type":"number"},{"id":"X018","title":"Количество одинаковых частей","text":"Ручка в 4 раза дороже тетрадки. Купили две тетрадки и три ручки. Сколько «цен тетрадки» в покупке?","hints":["Одна ручка — четыре одинаковые части.","Три ручки — 12 частей.","Прибавь две части за тетрадки."],"solution":"2 + 3 · 4 = 14 частей.","why":"Это количество частей, а не цена в ропиках.","group":"1","topic":"Покупки","difficulty":"Лёгкий","kind":"number","fields":[{"key":"x","label":"Ответ","ans":14}],"type":"number"},{"id":"X019","title":"Восстанови цену","text":"Три тетрадки и две ручки стоят 110 ропиков. Ручка в 4 раза дороже тетрадки. Сколько стоит ручка?","hints":["Назови цену тетрадки одной частью.","Всего 3 + 2·4 = 11 частей.","110 : 11 = 10, потом умножь на 4."],"solution":"Тетрадка 10, ручка 40 ропиков. Проверка: 3·10 + 2·40 = 110.","why":"Найденная стоимость части — это цена тетрадки.","group":"2","topic":"Покупки","difficulty":"Средний","kind":"number","fields":[{"key":"x","label":"Ответ","ans":40}],"type":"number"},{"id":"X020","title":"Восстанови сумму покупки","text":"Тетрадка стоит 12 ропиков. Альбом в 2 раза дороже тетрадки, набор красок в 3 раза дороже альбома. Купили одну тетрадку, два альбома и краски. Сколько заплатили?","hints":["Альбом 24, краски 72.","За два альбома 48.","12 + 48 + 72."],"solution":"12 + 2·24 + 72 = 132 ропика.","why":"Не спутай «три раза дороже альбома» с тетрадкой.","group":"2","topic":"Покупки","difficulty":"Средний","kind":"number","fields":[{"key":"x","label":"Ответ","ans":132}],"type":"number"},{"id":"X021","title":"Ошибка сравнения цен","text":"Карандаш стоит 5 ропиков, фломастер в 4 раза дороже. Какое выражение верно для цены двух фломастеров?","hints":["Сначала найди цену одного.","Один фломастер стоит 5 · 4.","Два — (5·4)·2."],"solution":"5 · 4 · 2 = 40 ропиков.","why":"Четыре раза — множитель, а не слагаемое.","group":"2","topic":"Покупки","difficulty":"Средний","kind":"choice","type":"choice","choices":[{"v":"0","t":"(5 + 4) · 2"},{"v":"1","t":"5 · 4 · 2"},{"v":"2","t":"5 · (4 + 2)"}],"answer":"1"},{"id":"X022","title":"Два вложенных сравнения","text":"Блокнот в 2 раза дороже ручки, а ручка в 5 раз дороже ластика. Блокнот стоит 150 ропиков. Сколько стоит ластик?","hints":["Один блокнот = две ручки.","Ручка стоит 150 : 2 = 75.","Ластик стоит 75 : 5."],"solution":"150 : 2 : 5 = 15 ропиков.","why":"Два множителя находятся в цепочке, а не складываются.","group":"3","topic":"Покупки","difficulty":"Сложный","kind":"number","fields":[{"key":"x","label":"Ответ","ans":15}],"type":"number"},{"id":"X023","title":"Уравняй две покупки","text":"В первой корзине две тетрадки по 20 ропиков и ручка за 45. Во второй — три такие тетрадки. На сколько первая корзина дороже?","hints":["Найди цены двух корзин.","Первая 85; вторая 60.","85 − 60."],"solution":"(2·20 + 45) − 3·20 = 25 ропиков.","why":"Сравнивать нужно итоги, а не количества предметов.","group":"3","topic":"Покупки","difficulty":"Сложный","kind":"number","fields":[{"key":"x","label":"Ответ","ans":25}],"type":"number"},{"id":"X024","title":"Придумай подходящую цену","text":"Придумай цену тетрадки и цену ручки, которая ровно в 3 раза дороже. Покажи, что за две тетрадки и ручку получится цена, кратная 5.","hints":["Возьми цену тетрадки кратной 5.","Если тетрадка 10, ручка 30.","2·10 + 30 = 50, кратно пяти."],"solution":"Например: тетрадка 10, ручка 30; покупка стоит 50 ропиков, 50 делится на 5.","why":"Важно дать свой численный пример и проверить оба условия.","group":"3","topic":"Покупки","difficulty":"Сложный","kind":"reason","type":"reason","rubric":["Названа положительная цена тетрадки.","Цена ручки ровно втрое больше.","Посчитана стоимость двух тетрадок и ручки.","Показано, что стоимость делится на 5."]},{"id":"X025","title":"Отдельный путь на велосипеде","text":"Совунья проезжает дорогу туда и обратно за 28 минут при постоянной скорости. Сколько длится один путь?","hints":["Одинаковое расстояние туда и обратно.","При одинаковой скорости время одинаково.","28 : 2."],"solution":"28 : 2 = 14 минут.","why":"Один путь — половина двух одинаковых.","group":"1","topic":"Движение","difficulty":"Лёгкий","kind":"number","fields":[{"key":"x","label":"Ответ","ans":14}],"type":"number"},{"id":"X026","title":"Смешанная дорога","text":"Пешком до школы идти 35 минут, на велосипеде 12 минут. Сколько времени понадобится на дорогу туда пешком, а обратно на велосипеде?","hints":["Есть два отдельных пути.","Время складывается.","35 + 12."],"solution":"35 + 12 = 47 минут.","why":"Нельзя умножать только велосипедное время на два.","group":"1","topic":"Движение","difficulty":"Лёгкий","kind":"number","fields":[{"key":"x","label":"Ответ","ans":47}],"type":"number"},{"id":"X027","title":"Найди пешее время","text":"На велосипеде туда и обратно 22 минуты. Пешком туда, на велосипеде обратно — 43 минуты. Сколько занимает пешая дорога в одну сторону?","hints":["Один велосипедный путь — половина 22.","Велосипед: 11 минут.","Пешком: 43 − 11."],"solution":"43 − 22:2 = 32 минуты.","why":"Из смешанной дороги вычитают только один велосипедный путь.","group":"2","topic":"Движение","difficulty":"Средний","kind":"number","fields":[{"key":"x","label":"Ответ","ans":32}],"type":"number"},{"id":"X028","title":"Что быстрее по времени?","text":"Вася проходит всю дорогу за 30 минут. Петя идёт вдвое быстрее Васи. Сколько времени потребуется Пете на ту же дорогу?","hints":["Одинаковый путь.","Вдвое быстрее означает вдвое меньше времени.","30 : 2."],"solution":"30 : 2 = 15 минут.","why":"Скорость и время на одинаковом пути обратно пропорциональны.","group":"2","topic":"Движение","difficulty":"Средний","kind":"number","fields":[{"key":"x","label":"Ответ","ans":15}],"type":"number"},{"id":"X029","title":"Два равных участка","text":"Пешеход проходит первую половину дороги за 12 минут, вторую половину — за 20 минут. Сколько минут занимает весь путь?","hints":["Половины дороги равны по длине, не обязательно по времени.","Времена двух участков складываем.","12 + 20."],"solution":"12 + 20 = 32 минуты.","why":"Не усредняй времена вместо сложения.","group":"2","topic":"Движение","difficulty":"Средний","kind":"number","fields":[{"key":"x","label":"Ответ","ans":32}],"type":"number"},{"id":"X030","title":"Замедление на половине","text":"Всю дорогу туда Пин шёл 40 минут. Обратно первую половину он шёл в 2 раза медленнее, вторую проехал на машине в 4 раза быстрее исходной ходьбы. Сколько заняла обратная дорога?","hints":["Половина при вдвое меньшей скорости требует 40 минут.","Вторая половина при скорости вчетверо большей — 40 : 8 = 5 минут.","Сумма 40 + 5."],"solution":"Обратно 40 + 5 = 45 минут.","why":"Не сложи значения скоростей вместо времён.","group":"3","topic":"Движение","difficulty":"Сложный","kind":"number","fields":[{"key":"x","label":"Ответ","ans":45}],"type":"number"},{"id":"X031","title":"Сравнение двух путей","text":"Туда шли 50 минут. Обратно первую половину расстояния шли вдвое медленнее, а вторую — в 5 раз быстрее обычного. Какую долю времени «туда» заняла дорога обратно?","hints":["Первая половина занимает всё время туда.","Вторая половина — одну десятую времени туда.","1 + 1/10."],"solution":"Обратно T + T/10 = 1,1T. Ответ: 1,1 времени туда.","why":"Ускорение на второй половине не отменяет полного времени на первой.","group":"3","topic":"Движение","difficulty":"Сложный","kind":"number","fields":[{"key":"x","label":"Ответ","ans":1.1}],"type":"number"},{"id":"X032","title":"Почему средняя скорость не среднее?","text":"Пин шёл половину расстояния со скоростью 2 км/ч, вторую половину — 6 км/ч. Можно ли получить среднюю скорость как (2 + 6) : 2 = 4 км/ч?","hints":["Время на одинаковых расстояниях разное.","На 6 км: по 3 км, время 1,5 ч и 0,5 ч.","6 км : 2 часа = 3 км/ч."],"solution":"Нельзя. Средняя скорость по двум половинам равна 3 км/ч, поскольку на 6 км уходит 2 часа.","why":"Среднее арифметическое скоростей работает при равном времени, а не равных расстояниях.","group":"3","topic":"Движение","difficulty":"Сложный","kind":"choice","type":"choice","choices":[{"v":"0","t":"Да, всегда"},{"v":"1","t":"Нет, получается 3 км/ч"},{"v":"2","t":"Нет, получается 8 км/ч"}],"answer":"1"},{"id":"X033","title":"Площадь прямоугольника","text":"Стороны прямоугольного потолка 6 и 5 м. Найди его площадь.","hints":["Площадь измеряют квадратными метрами.","Умножь две соседние стороны.","6 · 5."],"solution":"6 · 5 = 30 м².","why":"Нельзя складывать длину и ширину, если спрашивают площадь.","group":"1","topic":"Площадь","difficulty":"Лёгкий","kind":"number","fields":[{"key":"x","label":"Ответ","ans":30}],"type":"number"},{"id":"X034","title":"Плата за площадь","text":"Площадь комнаты 18 м², побелка стоит 80 ропиков за 1 м². Сколько стоит побелка?","hints":["За один квадратный метр 80.","За восемнадцать — в 18 раз больше.","18 · 80."],"solution":"18 · 80 = 1440 ропиков.","why":"Площадь умножают на цену за квадратный метр.","group":"1","topic":"Площадь","difficulty":"Лёгкий","kind":"number","fields":[{"key":"x","label":"Ответ","ans":1440}],"type":"number"},{"id":"X035","title":"Площадь широкой полосы","text":"Прямоугольный потолок увеличили по длине с 5 до 8 м, ширина осталась 4 м. На сколько квадратных метров выросла площадь?","hints":["Увеличение длины = 3 м.","Полоска шириной 4 м.","3 · 4."],"solution":"(8 − 5) · 4 = 12 м².","why":"Нельзя назвать 3 м², не учтя ширину полосы.","group":"2","topic":"Площадь","difficulty":"Средний","kind":"number","fields":[{"key":"x","label":"Ответ","ans":12}],"type":"number"},{"id":"X036","title":"Вычисли стоимость метра","text":"Два потолка одинаковой ширины 3 м имеют длины 6 и 9 м. Второй обошёлся на 720 ропиков дороже. Цена побелки 1 м²?","hints":["Лишняя площадь (9 − 6)·3 = 9 м².","За лишние 9 м² заплатили 720.","720 : 9."],"solution":"720 : 9 = 80 ропиков за квадратный метр.","why":"720 — не общая цена, а стоимость только дополнительной площади.","group":"2","topic":"Площадь","difficulty":"Средний","kind":"number","fields":[{"key":"x","label":"Ответ","ans":80}],"type":"number"},{"id":"X037","title":"Сравни два потолка","text":"Первый потолок 4×6 м, второй 3×8 м. Какой больше по площади?","hints":["Найди площади обоих.","4·6=24 и 3·8=24.","Площади одинаковы."],"solution":"Оба потолка по 24 м².","why":"Сравнивать только длины нельзя.","group":"2","topic":"Площадь","difficulty":"Средний","kind":"choice","type":"choice","choices":[{"v":"0","t":"Первый больше"},{"v":"1","t":"Второй больше"},{"v":"2","t":"Одинаковы"}],"answer":"2"},{"id":"X038","title":"Стоимость двух комнат","text":"Потолки двух комнат имеют размеры 5×4 м и 7×4 м. Побелка 1 м² стоит 75 ропиков. Найди общую стоимость.","hints":["Площади 20 и 28.","В сумме 48 м².","48 · 75."],"solution":"(5·4 + 7·4)·75 = 3600 ропиков.","why":"Сначала сумма площадей, затем цена за квадратный метр.","group":"3","topic":"Площадь","difficulty":"Сложный","kind":"number","fields":[{"key":"x","label":"Ответ","ans":3600}],"type":"number"},{"id":"X039","title":"Ошибка вычисления площади","text":"Саша написал: «Комната 6×4 м имеет периметр 20 м, значит, на её побелку по 100 ропиков за м² потратят 2000». Почему неверно?","hints":["Побелка зависит от площади, а не периметра.","Площадь 6·4 = 24 м².","Стоимость 24·100 = 2400."],"solution":"Неверно использован периметр. Побелка 24 м² × 100 = 2400 ропиков.","why":"Периметр и площадь отвечают на разные вопросы.","group":"3","topic":"Площадь","difficulty":"Сложный","kind":"choice","type":"choice","choices":[{"v":"0","t":"Нужно использовать площадь вместо периметра"},{"v":"1","t":"Нужно удвоить периметр"},{"v":"2","t":"Всё верно"}],"answer":"0"},{"id":"X040","title":"Восстанови ширину","text":"Побелка потолка длиной 8 м стоит 3200 ропиков при цене 100 ропиков за м². Найди ширину комнаты.","hints":["Найди площадь по сумме и цене.","3200 : 100 = 32 м².","Ширина 32 : 8."],"solution":"3200 : 100 : 8 = 4 м.","why":"Единицы на промежуточных шагах помогают не перепутать смысл.","group":"3","topic":"Площадь","difficulty":"Сложный","kind":"number","fields":[{"key":"x","label":"Ответ","ans":4}],"type":"number"},{"id":"X041","title":"Правильные ответы","text":"За каждый верный ответ дают по 3 конфеты. Крош ответил правильно 7 раз и неправильно 0 раз. Сколько конфет заработал?","hints":["Каждый успех прибавляет три.","Таких прибавок семь.","7 · 3."],"solution":"7·3 = 21 конфета.","why":"Здесь ищем полученные, а не общее количество в кармане.","group":"1","topic":"Логика и конфеты","difficulty":"Лёгкий","kind":"number","fields":[{"key":"x","label":"Ответ","ans":21}],"type":"number"},{"id":"X042","title":"Новый остаток конфет","text":"У Кроша было 50 конфет, он дал 6 правильных ответов (+4 за каждый) и 2 неправильных (−5 за каждый). Сколько стало?","hints":["За верные заработал 24.","За ошибки отдал 10.","50 + 24 − 10."],"solution":"50 + 6·4 − 2·5 = 64 конфеты.","why":"За неверные ответы конфет становится меньше.","group":"1","topic":"Логика и конфеты","difficulty":"Лёгкий","kind":"number","fields":[{"key":"x","label":"Ответ","ans":64}],"type":"number"},{"id":"X043","title":"Плата за одну ошибку","text":"За правильный ответ дают 5 конфет, за неправильный отнимают 7. На сколько конфет результат с ошибкой меньше результата с правильным ответом?","hints":["Сравни +5 и −7.","Разница между ними составляет 5 + 7.","5 + 7 = 12."],"solution":"Одна ошибка вместо верного ответа уменьшает результат на 12 конфет.","why":"Ошибка «стоит» больше, чем собственно штраф 7.","group":"2","topic":"Логика и конфеты","difficulty":"Средний","kind":"number","fields":[{"key":"x","label":"Ответ","ans":12}],"type":"number"},{"id":"X044","title":"Число неверных ответов","text":"У Кроша было 100 конфет, он ответил на 10 вопросов. За правильный ответ +3, за неправильный −2. В конце стало 115. Сколько ответов были неверными?","hints":["При всех правильных было бы 130.","Разница с 115 равна 15.","Каждая ошибка уменьшает максимум на 5."],"solution":"(130 − 115) : (3 + 2) = 3 ошибки.","why":"Не дели 15 на 2: отличие от успеха равно 5.","group":"2","topic":"Логика и конфеты","difficulty":"Средний","kind":"number","fields":[{"key":"x","label":"Ответ","ans":3}],"type":"number"},{"id":"X045","title":"Выбери первый шаг","text":"У Маши 40 баллов. Она решила 8 заданий: верное +4 балла, неверное −1. В конце стало 62 балла. С чего удобно начать?","hints":["Представь, что все восемь выполнены без ошибок.","Так проще понять разницу от максимума.","Максимум 40 + 8 · 4 = 72."],"solution":"Представим 8 верных: 72 балла. Разница с 62 — десять, одна ошибка «стоит» пять, значит, ошибок две.","why":"Гадать количество ошибок по одному не нужно.","group":"2","topic":"Логика и конфеты","difficulty":"Средний","kind":"choice","type":"choice","choices":[{"v":"0","t":"Сразу разделить 62 на 8"},{"v":"1","t":"Представить все восемь ответов правильными"},{"v":"2","t":"Вычесть 40 из 8"}],"answer":"1"},{"id":"X046","title":"Восстанови число успехов","text":"У Димы было 60 монет. За правильное решение +6, за ошибку −4. После 10 задач стало 100 монет. Сколько задач он решил верно?","hints":["При всех правильных было бы 120.","На самом деле 100, разница 20.","Каждая ошибка меняет максимум на 10; ошибок две."],"solution":"10 − (120 − 100):(6+4) = 8 верных. Проверка: 60+8·6−2·4 =100.","why":"Сумма штрафа и потерянной награды — 10.","group":"3","topic":"Логика и конфеты","difficulty":"Сложный","kind":"number","fields":[{"key":"x","label":"Ответ","ans":8}],"type":"number"},{"id":"X047","title":"Может ли быть такой итог?","text":"Начало — 30 конфет. За каждый из 5 вопросов: правильный +4, ошибочный −6. Может ли в конце быть ровно 45 конфет?","hints":["Если все верно — 50.","Одна ошибка уменьшает число сразу на 10.","Итог должен быть 50, 40, 30 и так далее."],"solution":"Нет. Все возможные результаты отличаются от 50 на число, кратное 10; 45 не подходит.","why":"Недостаточно сказать «не получилось при пробах»: нужна закономерность.","group":"3","topic":"Логика и конфеты","difficulty":"Сложный","kind":"choice","type":"choice","choices":[{"v":"0","t":"Да, если один ответ неверный"},{"v":"1","t":"Нет: каждый промах меняет максимум на 10"},{"v":"2","t":"Да, если два ответа неверных"}],"answer":"1"},{"id":"X048","title":"Доказательство числа ответов","text":"Сыграли 12 раундов. За победу +5 очков, за поражение −3. Было 20 очков, стало 56. Докажи, сколько побед и поражений было.","hints":["При всех победах было бы 20 + 12·5 = 80.","Недостача равна 80 − 56 = 24.","Одна неудача вместо победы отнимает 8; значит, неудач три."],"solution":"Поражений 24 : (5 + 3) = 3, побед 12 − 3 = 9. Проверка: 20 + 9·5 − 3·3 = 56.","why":"Нужна проверка обратно по начальному условию.","group":"3","topic":"Логика и конфеты","difficulty":"Сложный","kind":"reason","type":"reason","rubric":["Посчитан максимум 80.","Найдена недостача 24.","Объяснено отличие одной ошибки от победы: 8.","Получены 9 побед и 3 поражения, есть проверка."]},{"id":"X049","title":"Доля каждого гостя","text":"Трое друзей поровну поделили покупки стоимостью 450 ропиков. Сколько стоит съеденная каждым часть?","hints":["Все получили равные части.","Стоимость делим на три.","450 : 3."],"solution":"450 : 3 = 150 ропиков на каждого.","why":"Равенство порций означает равенство стоимости порции.","group":"1","topic":"Равные доли","difficulty":"Лёгкий","kind":"number","fields":[{"key":"x","label":"Ответ","ans":150}],"type":"number"},{"id":"X050","title":"Сколько вернуть?","text":"Два друга купили одинаковые угощения за 210 и 390 ропиков. Пришёл третий и все съели поровну. Сколько третий должен вернуть первому?","hints":["Всего потратили 600.","На каждого приходится 200.","Первый заплатил 210, переплата 10."],"solution":"210 − (210 + 390):3 = 10 ропиков.","why":"Возврат не делится поровну между платившими.","group":"1","topic":"Равные доли","difficulty":"Лёгкий","kind":"number","fields":[{"key":"x","label":"Ответ","ans":10}],"type":"number"},{"id":"X051","title":"Разделите платежи","text":"Оля и Петя купили общий обед за 260 и 340 ропиков. С ними пообедал третий человек; всем поровну. Сколько он должен вернуть Пете?","hints":["Общая стоимость 600.","Доля каждого 200.","Петя заплатил 340, переплата 140."],"solution":"340 − 200 = 140 ропиков.","why":"Петя получит больше Оли, потому что изначально больше заплатил.","group":"2","topic":"Равные доли","difficulty":"Средний","kind":"number","fields":[{"key":"x","label":"Ответ","ans":140}],"type":"number"},{"id":"X052","title":"Четыре человека","text":"Первый заплатил 400 ропиков, второй — 200, третий — 200, четвёртый ничего не платил. Все четверо поделили еду поровну. Сколько четвёртый должен отдать первому?","hints":["Всего уплачено 800.","На каждого приходится 200.","Первый внёс на 200 больше своей доли."],"solution":"400 − 800:4 = 200 ропиков.","why":"Второму и третьему доплачивать не нужно: они уже заплатили по доле.","group":"2","topic":"Равные доли","difficulty":"Средний","kind":"number","fields":[{"key":"x","label":"Ответ","ans":200}],"type":"number"},{"id":"X053","title":"Отрицательный возврат","text":"Нюша заплатила 120, Крош — 480 ропиков. Пришёл третий; все едят поровну. Какое утверждение верно?","hints":["Всего 600, доля каждого 200.","Нюша внесла меньше, чем стоит её порция.","Она должна доплатить 80; Крош получает 280."],"solution":"Нюша должна доплатить ещё 80 ропиков, а не получить возврат: она заплатила меньше своей справедливой доли.","why":"Возврат может быть отрицательным: это долг самого покупателя.","group":"2","topic":"Равные доли","difficulty":"Средний","kind":"choice","type":"choice","choices":[{"v":"0","t":"Третий отдаст Нюше 80 ропиков"},{"v":"1","t":"Нюше надо доплатить 80 ропиков"},{"v":"2","t":"Все уже заплатили поровну"}],"answer":"1"},{"id":"X054","title":"Восстанови первоначальный платёж","text":"За общую трапезу трёх гостей уплатили 690 ропиков. Нюша должна получить обратно 60 ропиков, чтобы её конечный расход стал равен доле каждого. Сколько заплатила Нюша до возврата?","hints":["Доля 690 : 3 = 230.","Нюша заплатила на 60 больше.","230 + 60."],"solution":"690:3 + 60 = 290 ропиков.","why":"Возвращаемые деньги вычитаются из первоначального платежа.","group":"3","topic":"Равные доли","difficulty":"Сложный","kind":"number","fields":[{"key":"x","label":"Ответ","ans":290}],"type":"number"},{"id":"X055","title":"Найди ошибку в распределении","text":"Двое уплатили 280 и 320 ропиков, третий пришёл позже; всё поделено на троих. Третий заплатил первому 100, второму 100. Справедливо ли это?","hints":["Доля одного 200.","Первый переплатил 80, второй 120.","Компенсация должна быть 80 и 120."],"solution":"Нет, справедливо отдать первому 80, второму 120 ропиков.","why":"Третий платит 200 всего, но распределяет сумму не пополам.","group":"3","topic":"Равные доли","difficulty":"Сложный","kind":"choice","type":"choice","choices":[{"v":"0","t":"Да: оба получили поровну"},{"v":"1","t":"Нет: нужно 80 и 120"},{"v":"2","t":"Нет: нужно 200 и 200"}],"answer":"1"},{"id":"X056","title":"Построй свои доли","text":"Придумай пример: трое разделили еду поровну, два друга изначально платили разные суммы, третий ничего не платил. Покажи компенсации так, чтобы итоговые расходы совпали.","hints":["Выбери общую цену, кратную трём.","Например, цена 600, платежи 250 и 350.","Каждому должна достаться доля 200; компенсация 50 и 150."],"solution":"Например: первоначально 250 и 350 ропиков, всего 600. Третий возвращает 50 и 150. Все в итоге заплатили по 200.","why":"Три окончательных расхода должны совпадать.","group":"3","topic":"Равные доли","difficulty":"Сложный","kind":"reason","type":"reason","rubric":["Задана общая положительная сумма и разные платежи двух друзей.","Доля каждого вычислена как общая сумма : 3.","Компенсации обоснованы переплатами.","После возврата все трое заплатили поровну."]},{"id":"X057","title":"Вместимость упаковок","text":"Три упаковки по 13 карандашей и две по 17. Сколько карандашей всего?","hints":["Умножь размер на количество каждого типа.","3·13=39, 2·17=34.","39 + 34."],"solution":"3·13 + 2·17 = 73 карандаша.","why":"Размер и число упаковок играют разные роли.","group":"1","topic":"Перебор наборов","difficulty":"Лёгкий","kind":"number","fields":[{"key":"x","label":"Ответ","ans":73}],"type":"number"},{"id":"X058","title":"Ограничение снизу","text":"В магазине есть только коробки по 11 карандашей. Сколько коробок надо купить, чтобы было не меньше 57 карандашей?","hints":["Пять коробок дают 55.","Этого меньше 57.","Шесть дадут 66."],"solution":"Не меньше 57 требуют 6 коробок.","why":"«Не меньше» не означает «строго 57».","group":"1","topic":"Перебор наборов","difficulty":"Лёгкий","kind":"number","fields":[{"key":"x","label":"Ответ","ans":6}],"type":"number"},{"id":"X059","title":"Не хватает до нужного числа","text":"Пять коробок по 19 содержат 95 карандашей. Сколько не хватает до 100?","hints":["Сначала подсчитай 5·19.","Получится 95.","100 − 95."],"solution":"100 − 5·19 = 5 карандашей.","why":"Задача о недостающих карандашах, а не количестве коробок.","group":"2","topic":"Перебор наборов","difficulty":"Средний","kind":"number","fields":[{"key":"x","label":"Ответ","ans":5}],"type":"number"},{"id":"X060","title":"Найди число вариантов","text":"Нужно ровно 59 карандашей из трёх упаковок по 19, 20 или 21 карандашу. Сколько разных наборов можно купить? Порядок не учитывается.","hints":["Три упаковки по 19 дают 57.","Не хватает двух карандашей.","Заменить две 19 на 20 или одну 19 на 21: оба возможны."],"solution":"От трёх упаковок по 19 получается 57. Нужна прибавка +2. Её дают либо две замены 19→20, либо одна замена 19→21. Поэтому два набора: (1,2,0) и (2,0,1).","why":"Не останавливайся на первом найденном способе получить +2.","group":"2","topic":"Перебор наборов","difficulty":"Средний","kind":"number","fields":[{"key":"x","label":"Разных наборов","ans":2}],"type":"number"},{"id":"X061","title":"Выбери доказательство границ","text":"Сколько может быть упаковок по 19–21 карандашу, если нужно ровно 153 карандаша?","hints":["Семи упаковок даже по 21 мало.","Девять по 19 дают слишком много.","Между 7 и 9 только 8."],"solution":"Ровно восемь упаковок. 7·21=147<153 и 9·19=171>153.","why":"Обоснуй и нижнюю, и верхнюю границу.","group":"2","topic":"Перебор наборов","difficulty":"Средний","kind":"choice","type":"choice","choices":[{"v":"0","t":"От 7 до 9 включительно"},{"v":"1","t":"Ровно 8"},{"v":"2","t":"Ровно 9"}],"answer":"1"},{"id":"X062","title":"Добавка к базовым упаковкам","text":"Нужно получить 163 карандаша из восьми коробок по 19, 20 или 21. На сколько карандашей нужно увеличить набор из восьми коробок по 19?","hints":["База — 8·19.","Это 152 карандаша.","163 − 152."],"solution":"163 − 152 = 11 дополнительных карандашей.","why":"Эта добавка распределяется заменами коробок.","group":"3","topic":"Перебор наборов","difficulty":"Сложный","kind":"number","fields":[{"key":"x","label":"Ответ","ans":11}],"type":"number"},{"id":"X063","title":"Варианты при общей добавке","text":"Из четырёх коробок по 9, 10 или 11 карандашей нужно составить ровно 40 карандашей. Сколько различных наборов есть, если порядок не учитывается?","hints":["Основа 4·9 = 36, нужно добавить 4.","Пусть по 11 будет c, по 10 — b, тогда b + 2c = 4.","c=0,1,2: три подходящих набора."],"solution":"Наборы (9,10,11) равны (0,4,0), (1,2,1), (2,0,2). Всего три.","why":"Учитывай неупорядоченные количества коробок, а не порядок покупки.","group":"3","topic":"Перебор наборов","difficulty":"Сложный","kind":"number","fields":[{"key":"x","label":"Ответ","ans":3}],"type":"number"},{"id":"X064","title":"Докажи все наборы","text":"Нужно получить ровно 43 карандаша из упаковок по 10, 11 и 12 штук. Найди все наборы и докажи, что других нет.","hints":["Три упаковки не дадут больше 36, пять дадут не меньше 50.","Значит, упаковок четыре. База 4·10 = 40, добавка +3.","Пусть коробок по 11 будет b, по 12 — c: b + 2c = 3."],"solution":"Всего два набора: (по 10, 11, 12) = (1,3,0), (2,1,1).","why":"Доказывай не только правильность наборов, но и невозможность остальных.","group":"3","topic":"Перебор наборов","difficulty":"Сложный","kind":"reason","type":"reason","rubric":["Указано, что упаковок строго четыре, с проверкой 3·12<43<5·10.","Найдены база 4·10=40 и прибавка 3.","Перечислены решения b+2c=3: (b,c)=(3,0),(1,1).","Проверены оба набора и исключены остальные."]},{"id":"X065","title":"Равные массы","text":"Нюша и Крош вместе весят 32 кг и весят одинаково. Сколько весит Крош?","hints":["Массы равны.","Общая масса двух одинаковых.","32 : 2."],"solution":"32 : 2 = 16 кг.","why":"Равенство масс дано в условии.","group":"1","topic":"Массы и сравнение","difficulty":"Лёгкий","kind":"number","fields":[{"key":"x","label":"Ответ","ans":16}],"type":"number"},{"id":"X066","title":"Сравни вес с одним общим","text":"Нюша с Ёжиком весят 40 кг, Крош с Ёжиком — 43 кг. На сколько Крош тяжелее Нюши?","hints":["Ёжик присутствует в обеих парах.","Разница общих весов — разница веса двух остальных.","43 − 40."],"solution":"43 − 40 = 3 кг.","why":"Не нужно знать массу Ёжика.","group":"1","topic":"Массы и сравнение","difficulty":"Лёгкий","kind":"number","fields":[{"key":"x","label":"Ответ","ans":3}],"type":"number"},{"id":"X067","title":"Найди массу третьего","text":"Нюша и Крош вместе весят 26 кг, их массы равны. Нюша и Ёжик весят 34 кг. Сколько весит Ёжик?","hints":["Каждый из равных 26 : 2 = 13.","Нюша весит 13.","34 − 13."],"solution":"Ёжик 34 − 26:2 = 21 кг.","why":"Нельзя делить 34 пополам без равенства масс.","group":"2","topic":"Массы и сравнение","difficulty":"Средний","kind":"number","fields":[{"key":"x","label":"Ответ","ans":21}],"type":"number"},{"id":"X068","title":"Три парных взвешивания","text":"Аня с Борей весят 48 кг, Аня с Вовой — 54 кг, Боря с Вовой — 50 кг. Сколько весит Аня?","hints":["Сложи первые две суммы.","Получится 2 Ани + Боря + Вова.","Вычти 50, затем раздели на 2."],"solution":"(48 + 54 − 50) : 2 = 26 кг.","why":"Один и тот же ребёнок учитывается дважды.","group":"2","topic":"Массы и сравнение","difficulty":"Средний","kind":"number","fields":[{"key":"x","label":"Ответ","ans":26}],"type":"number"},{"id":"X069","title":"Масса всех троих","text":"Пары детей на весах показывают 30, 35 и 37 кг. Сколько весят все трое вместе?","hints":["При сложении всех пар каждый ребёнок входит дважды.","30 + 35 + 37 = 102.","102 : 2."],"solution":"(30+35+37):2 = 51 кг.","why":"Это масса всех, а не одного.","group":"2","topic":"Массы и сравнение","difficulty":"Средний","kind":"number","fields":[{"key":"x","label":"Ответ","ans":51}],"type":"number"},{"id":"X070","title":"Найди неверную мысль","text":"Пары весят А+Б=22 кг, А+В=30 кг, Б+В=32 кг. Дима считает, что А=(22+30−32)=20 кг. Что он забыл?","hints":["Суммы А+Б и А+В содержат две массы А.","Вычитание Б+В оставляет 2A.","Нужно разделить на 2."],"solution":"А=(22+30−32):2 = 10 кг.","why":"Сложение двух сумм считает массу А два раза.","group":"3","topic":"Массы и сравнение","difficulty":"Сложный","kind":"choice","type":"choice","choices":[{"v":"0","t":"Прибавить 32 ещё раз"},{"v":"1","t":"Разделить результат на 2"},{"v":"2","t":"Вычесть 22"}],"answer":"1"},{"id":"X071","title":"Найди все три массы","text":"Суммы масс трёх пар: А+Б=24, А+В=28, Б+В=30 кг. Найди массу каждого.","hints":["Сложи три парные суммы.","Общая масса равна (24+28+30):2 = 41.","Каждая отдельная масса = 41 минус масса противоположной пары."],"solution":"А=41−30=11; Б=41−28=13; В=41−24=17.","why":"Каждая пара учитывается ровно один раз при вычитании из общей суммы.","group":"3","topic":"Массы и сравнение","difficulty":"Сложный","kind":"number","fields":[{"key":"a","label":"А, кг","ans":11},{"key":"b","label":"Б, кг","ans":13},{"key":"c","label":"В, кг","ans":17}],"type":"number"},{"id":"X072","title":"Может ли такое быть?","text":"Аня и Боря весят 38 кг, Аня и Вова — 34 кг, Боря и Вова — 40 кг. Возможны ли целые положительные массы трёх детей?","hints":["Масса всех троих — (38 + 34 + 40) : 2.","Это 56 кг.","Значит, отдельные массы 16, 22, 18."],"solution":"Да: Аня 16, Боря 22, Вова 18.","why":"Проверь все три суммы: 16+22=38,16+18=34,22+18=40.","group":"3","topic":"Массы и сравнение","difficulty":"Сложный","kind":"choice","type":"choice","choices":[{"v":"0","t":"Да, массы 16, 22, 18 кг"},{"v":"1","t":"Нет, получаются дроби"},{"v":"2","t":"Нет, массы отрицательные"}],"answer":"0"},{"id":"X073","title":"Стоимость трёх покупок","text":"Одно мороженое стоит 18 ропиков. Сколько стоят четыре таких мороженых?","hints":["Цена одного — 18.","Купили четыре одинаковых.","18 · 4."],"solution":"18 · 4 = 72 ропика.","why":"Не путай цену одного с общим платежом.","group":"1","topic":"Магазин и сдача","difficulty":"Лёгкий","kind":"number","fields":[{"key":"x","label":"Ответ","ans":72}],"type":"number"},{"id":"X074","title":"Найди сдачу","text":"Было 200 ропиков, купили 5 мороженых по 24 ропика. Сколько осталось?","hints":["На мороженое потратили 5·24.","Расход 120.","200 − 120."],"solution":"200 − 5·24 = 80 ропиков.","why":"Сдача не равна стоимости мороженого.","group":"1","topic":"Магазин и сдача","difficulty":"Лёгкий","kind":"number","fields":[{"key":"x","label":"Ответ","ans":80}],"type":"number"},{"id":"X075","title":"Цена по разнице","text":"После покупки 4 мороженых осталось 90 ропиков, после покупки 7 таких же осталось 54 ропика. Сколько стоит одно?","hints":["Разница покупок — три мороженых.","Разница сдачи 90 − 54 = 36.","36 : 3."],"solution":"(90 − 54):(7 − 4) = 12 ропиков.","why":"Сначала сравни покупки, не складывай сдачу.","group":"2","topic":"Магазин и сдача","difficulty":"Средний","kind":"number","fields":[{"key":"x","label":"Ответ","ans":12}],"type":"number"},{"id":"X076","title":"Изначальный бюджет","text":"За 6 одинаковых соков по 15 ропиков осталось 70. Сколько денег было до покупки?","hints":["Потратили 6·15 = 90.","Остаток 70.","90 + 70."],"solution":"6·15 + 70 = 160 ропиков.","why":"Бюджет равен расходу плюс остаток.","group":"2","topic":"Магазин и сдача","difficulty":"Средний","kind":"number","fields":[{"key":"x","label":"Ответ","ans":160}],"type":"number"},{"id":"X077","title":"Максимум целых покупок","text":"У Ёжика 145 ропиков, мороженое стоит 18. Сколько целых мороженых он может купить максимум?","hints":["Восемь стоят 144.","Девять стоят 162.","Купить можно восемь."],"solution":"145 : 18 = 8 целых мороженых и 1 ропик сдачи.","why":"Нельзя купить дробь мороженого в рамках задачи.","group":"2","topic":"Магазин и сдача","difficulty":"Средний","kind":"number","fields":[{"key":"x","label":"Ответ","ans":8}],"type":"number"},{"id":"X078","title":"Найди две цены","text":"После покупки 3 одинаковых блокнотов оставалось 70 ропиков, а после 5 таких блокнотов — 30 ропиков. Сколько денег было изначально?","hints":["Два дополнительных блокнота «съели» 40 ропиков.","Один блокнот стоит 20.","3·20 + 70."],"solution":"Цена блокнота (70−30):(5−3)=20, бюджет 3·20+70=130 ропиков.","why":"Сдача убывает из-за количества купленного товара.","group":"3","topic":"Магазин и сдача","difficulty":"Сложный","kind":"number","fields":[{"key":"x","label":"Ответ","ans":130}],"type":"number"},{"id":"X079","title":"Проверка ошибки в магазине","text":"За 2 печенья осталось 60 ропиков, а за 5 одинаковых печений осталось 15. Петя считает, что одно стоит (60−15):5=9. Как надо?","hints":["Разница количеств 5−2.","Разница сдачи 60−15.","Цена (60−15):(5−2)=15."],"solution":"Правильно 45 : 3 = 15 ропиков за печенье.","why":"Дополнительный расход связан с тремя, а не пятью печеньями.","group":"3","topic":"Магазин и сдача","difficulty":"Сложный","kind":"choice","type":"choice","choices":[{"v":"0","t":"Разделить 45 на 5"},{"v":"1","t":"Разделить 45 на 3"},{"v":"2","t":"Сложить остатки"}],"answer":"1"},{"id":"X080","title":"Придумай два чека","text":"Придумай два заказа одинакового товара так, чтобы по оставшейся сдаче можно было вычислить цену одного предмета. Запиши оба количества, обе сдачи и объяснение.","hints":["Начни с бюджета, например 100 ропиков.","Выбери цену одного предмета 10, количества 3 и 7.","Остатки 70 и 30, цена (70−30):(7−3)=10."],"solution":"Пример: бюджет 100, по 3 товара остаётся 70, по 7 остаётся 30. Цена (70−30):(7−3)=10 ропиков.","why":"Проверь, чтобы оба чека имели один бюджет и одну цену.","group":"3","topic":"Магазин и сдача","difficulty":"Сложный","kind":"reason","type":"reason","rubric":["Два количества товара различаются.","Оба остатка неотрицательны и относятся к одному начальному бюджету.","Разница остатков разделена на разницу количеств.","Полученная цена согласуется с обоими чеками."]}],"finals":[{"id":"F1","title":"Итог 1 · Разрезанные листы","text":"Из 8 листов бумаги сделали 23 кусочка. Каждый разрезанный лист превращался ровно в 4 части. Сколько листов разрезали?","hints":["Вычисли прирост.","23 − 8 = 15, прибавка за лист равна 3.","15 : 3 = 5."],"solution":"(23 − 8) : (4 − 1) = 5 листов.","why":"Прибавка от 4 частей — три.","group":"final","tag":"","fields":[{"key":"x","label":"Листов","ans":5}],"type":"number"},{"id":"F2","title":"Итог 2 · Две команды","text":"Первая команда делает 45 изделий за день, вторая — 54. Вторая начала на два дня позже, а суммарный результат у них одинаковый. Сколько изделий они сделали вместе?","hints":["Фора первой команды получена за 2 дня.","Фора 90; разница скоростей 9, значит, вторая работала 10 дней.","10 · 54 · 2 = 1080."],"solution":"90 : 9 = 10 дней второй команды; 10·54·2 = 1080.","why":"Первая работала на 2 дня дольше.","group":"final","tag":"","fields":[{"key":"x","label":"Изделий","ans":1080}],"type":"number"},{"id":"F3","title":"Итог 3 · Магазин","text":"Тетрадка, две ручки и альбом стоят 260 ропиков. Ручка в 3 раза дороже тетрадки, альбом в 2 раза дороже ручки. Найди цены.","hints":["Возьми стоимость тетрадки за одну часть.","1 + 2 · 3 + 6 = 13 частей.","Тетрадка 20, ручка 60, альбом 120."],"solution":"260 : 13 = 20; 3·20=60; 2·60=120.","why":"Учти две ручки в общей сумме.","group":"final","tag":"","fields":[{"key":"n","label":"Тетрадка, роп.","ans":20},{"key":"p","label":"Ручка, роп.","ans":60},{"key":"a","label":"Альбом, роп.","ans":120}],"type":"number"},{"id":"F4","title":"Итог 4 · Конфеты","text":"У Кроша было 80 конфет. За каждый правильный ответ ему дают 5, за неправильный отнимают 3. После 16 ответов стало 112 конфет. Сколько правильных ответов?","hints":["Если все верно: 80 + 16·5 = 160.","Фактическая разница 48, каждая ошибка «стоит» 5 + 3 = 8.","Ошибок 48 : 8 = 6; верных 16 − 6 = 10."],"solution":"80 + 10·5 − 6·3 = 112; 10 верных.","why":"Не путай штраф −3 с потерей −8 относительно правильного ответа.","group":"final","tag":"","fields":[{"key":"x","label":"Правильных ответов","ans":10}],"type":"number"},{"id":"F5","title":"Итог 5 · Докажи количество вариантов","text":"Нужно купить ровно 97 карандашей упаковками по 12, 13, 14 штук. Сколько разных наборов можно составить? Порядок покупки не важен.","hints":["6 · 14 = 84 < 97, 9 · 12 = 108 > 97: упаковок семь или восемь.","Для 7 упаковок: 7 · 12 = 84, надо добавить 13; для 8: 8 · 12 = 96, надо добавить 1.","Для 7 упаковок: одна по 13 и шесть по 14. Для 8 упаковок: семь по 12 и одна по 13."],"solution":"Два набора: 1×13 + 6×14 = 97; 7×12 + 1×13 = 97. Других нет по ограничению числа упаковок и прибавки относительно упаковок по 12.","why":"Не предполагай число упаковок без проверки обеих границ.","group":"final","tag":"","fields":[{"key":"x","label":"Вариантов","ans":2}],"type":"number"}],"homework":[["ДЗ 1","Было 11 листов бумаги. Некоторые листы разрезали на 4 части, после чего стало 32 кусочка. Сколько листов разрезали?","7 листов; (32 − 11) : 3 = 7."],["ДЗ 2","Совунья ехала на велосипеде туда и обратно 18 минут. Пешком туда и на велосипеде обратно — 35 минут. Сколько займёт путь пешком в обе стороны?","52 минуты; 18 : 2 = 9, пешком туда 35 − 9 = 26, два пути 52."],["ДЗ 3","Первая бригада делает 64 детали в день, вторая — 80. Вторая начала на один день позже, а сделала столько же. Сколько деталей сделали обе бригады вместе?","640 деталей; 64 : 16 = 4 дня второй бригады; 4 · 80 · 2 = 640."],["ДЗ 4","Потолок первой комнаты 7 × 3 м, второй — 9 × 3 м. За вторую заплатили на 450 ропиков больше. Сколько стоит побелка обоих потолков при одинаковой цене за квадратный метр?","3600 ропиков; (9 − 7) · 3 = 6 м², ставка 75, общая площадь 48."],["ДЗ 5","Лосяшу нужно купить ровно 101 карандаш упаковками по 12, 13 и 14 штук. Найди все наборы и докажи, что других нет.","3 варианта: (12,13,14) = (3,5,0), (4,3,1), (5,1,2). 8 упаковок, базовые 96, добавка 5."]],"warm":[{"id":"W1","text":"Один лист разрезали на 3 части. На сколько увеличилось число кусочков?","options":["На 1","На 2","На 3"],"ans":1,"ex":"Вместо одного листа стало три: прибавилось 3 − 1 = 2."},{"id":"W2","text":"Ширина прямоугольника 3 м, длина 4 м. Чему равна площадь?","options":["7 м²","12 м²","14 м²"],"ans":1,"ex":"Площадь прямоугольника = длина · ширина = 4 · 3 = 12 м²."},{"id":"W3","text":"Если за один день делают 6 деталей, то сколько сделают за 4 дня с тем же темпом?","options":["10","24","2"],"ans":1,"ex":"Работа = производительность · время = 6 · 4 = 24 детали."}]};
const STORE_KEY='repet-seriya8-text-v3';
const sections=[['examples','Урок с анимациями'],['sources','8 задач из файла'],['practice','Большой тренажёр'],['summary','Шпаргалка и итоги'],['start','Начало'],['final','Итоговая проверка'],['homework','Домашняя работа'],['teacher','Учителю']];
function defaults(){return {filters:{topic:'all',difficulty:'all',status:'all',page:1},answers:{},statuses:{},attempts:{},hints:{},reveals:{},warm:{},example:{cut:[],selected:0,cutPrediction:'',workDay:0,workGuess:'',iceGuess:'',iceUnlocked:false,iceCount:7},labs:{},active:'examples',teacher:false,expCurrent:'log',expDone:{},logCuts:6,logGuess:'',logNotice:'',logMini:'',logMiniResult:'',logMiniAttempts:0,logMiniHint:0,logMiniReveal:false}}
let S=defaults();try{const loaded=JSON.parse(localStorage.getItem(STORE_KEY)||'null');if(loaded&&typeof loaded==='object'){S={...S,...loaded,example:{...S.example,...loaded.example},filters:{...S.filters,...loaded.filters},expDone:{...S.expDone,...loaded.expDone}}}}catch(e){}
const safe=(x)=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const save=()=>{try{localStorage.setItem(STORE_KEY,JSON.stringify(S))}catch(e){};const cnt=document.querySelector('.exp-counter');if(cnt){let n=Object.values(S.expDone||{}).filter(Boolean).length;cnt.textContent=`${n} / 7 опытов пройдено`;document.querySelectorAll('[data-exp]').forEach(btn=>{const id=btn.dataset.exp,done=!!S.expDone[id],name=btn.textContent.replace(/ ✓$/,'');btn.textContent=name+(done?' ✓':'');});const eb=document.querySelector('[data-action="expdone"]');if(eb){let done=!!S.expDone[S.expCurrent||'log'];eb.classList.toggle('checked',done);eb.textContent=done?'✓ Пройдено':'○ Отметить пройденным';eb.setAttribute('aria-pressed',String(done));}}};
const route=()=>{let h=decodeURIComponent(location.hash.slice(1)).split('?')[0];return sections.some(s=>s[0]===h)?h:(S.active||'start')};
const solved=()=>Object.keys(S.statuses).filter(k=>['independent','help'].includes(S.statuses[k])).length+Object.values(S.warm).filter(v=>v?.correct).length;
const possible=3+DATA.sources.length+DATA.practice.length+DATA.finals.length;
const navIcons={examples:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.5 1.5M17.2 17.2l1.5 1.5M18.7 5.3l-1.5 1.5M6.8 17.2l-1.5 1.5"/></svg>',sources:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',practice:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 8h5M8 12h4M9 16l2 2 4-4"/></svg>',summary:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M5 4h14v17H5zM8 8h8M8 12h8M8 16h5"/></svg>'};
function updateNav(){const r=route();S.active=r;const progress=Math.round(100*solved()/possible),count=solved(),done=Object.keys(S.expDone||{}).filter(k=>S.expDone[k]).length;document.getElementById('topMeta').textContent=`${count} из ${possible}`;document.getElementById('topProgress').style.width=progress+'%';let sp=document.getElementById('sideProgress');if(sp)sp.style.width=progress+'%';let st=document.getElementById('sideProgressText');if(st)st.textContent=`${count} из ${possible} заданий решено`;
const primary=sections.slice(0,4);document.getElementById('sideNav').innerHTML=primary.map(([id,t])=>`<button type="button" data-go="${id}" class="navbutton ${id===r?'active':''}" ${id===r?'aria-current="page"':''}><span class="navicon">${navIcons[id]}</span><span class="navlabel">${safe(t)}</span>${id==='examples'?'<span class="count">7</span>':id==='sources'?'<span class="count">8</span>':id==='practice'?`<span class="count">${DATA.practice.length}</span>`:''}</button>`).join('');
const m=document.getElementById('mobileNav');m.innerHTML=[...primary,['final','Проверка'],['homework','Домашнее']].map(([id,t])=>`<button type="button" data-go="${id}" class="${id===r?'active':''}">${safe(t)}</button>`).join('');document.getElementById('teacherButton').setAttribute('aria-pressed',String(S.teacher));document.getElementById('teacherButton').textContent=S.teacher?'Режим учителя: вкл.':'Для учителя';}

function navigate(id){if(id==='teacher'&&!S.teacher)id='start';S.active=id;save();if(location.hash!==`#${id}`)location.hash=id;render();window.scrollTo({top:0,behavior:'instant'})}
